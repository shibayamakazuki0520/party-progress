<link rel="manifest" href="./manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --wine: #00A86B;
  --wine-deep: #046A44;
  --wine-soft: #1F8055;
  --blush: #BEEED9;
  --blush-soft: #EAFBF3;
  --cream: #F7FCFA;
  --gold: #FFC93C;
  --gold-soft: #FFE9AE;
  --pink: #FF2D78;
  --ink: #1E2A24;
  --ink-soft: #6B7C74;
  --line: #DCEFE5;
  --surface: #FFFFFF;
  --mini-badge-bg: #FFE9AE;
  --mini-badge-fg: #8A6A00;
  --solo-badge-bg: #D8F5E6;
  --solo-badge-fg: #0E7A4E;
  --mix-badge-bg: #FFE1EC;
  --mix-badge-fg: #C21F5B;
  --star-inactive: #C9DCD3;
  --done-bg: #EEF3F0;
  --done-fg: #94A39C;
  --reh-chip-bg: #F1F8F4;
  --final-badge-bg: #FFE1EC;
  --final-badge-fg: #C21F5B;
  --prelim-badge-bg: #E8F0FE;
  --prelim-badge-fg: #2F6FED;
}
:root[data-theme="dark"]{
  --blush-soft: #17201A;
  --cream: #0D130E;
  --ink: #EAF3EE;
  --ink-soft: #8FA69B;
  --line: #263029;
  --wine-soft: #7FDDB2;
  --surface: #1C2620;
  --star-inactive: #3E4C45;
  --done-bg: #232A24;
  --done-fg: #7C9186;
  --reh-chip-bg: #232A24;
  --final-badge-bg: #3A1826;
  --final-badge-fg: #FF7FAE;
  --prelim-badge-bg: #16223A;
  --prelim-badge-fg: #7FA9F5;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family: "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
  background: var(--cream);
  color: var(--ink);
  padding-bottom: 40px;
  transition: background .2s, color .2s;
}
header{
  background: linear-gradient(135deg, var(--wine-deep), var(--wine));
  color: #fff;
  padding: 20px 20px 18px;
  position: relative;
  border-radius: 0 0 20px 20px;
}
.brand{
  font-family: "Cormorant Garamond", serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 3px;
  opacity: .85;
  margin-bottom: 4px;
}
#eventTitle{
  font-family: "Shippori Mincho", serif;
  font-size: 21px;
  font-weight: 600;
  margin: 0 0 4px;
}
#eventMeta{
  font-size: 12px;
  opacity: .9;
}
.header-actions{
  position:absolute;
  top: 16px;
  right: 16px;
  display:flex;
  gap: 8px;
}
.theme-toggle, .starbucks-header-btn{
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.22);
  color: #fff;
  font-size: 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
#eventNote{
  font-size: 10.5px;
  opacity: .8;
  margin-top: 8px;
  line-height: 1.5;
}
#driftBanner{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap: 10px;
  background: var(--gold-soft);
  color: #6b4f00;
  font-size: 12.5px;
  padding: 8px 16px;
  margin: 10px 16px 0;
  border-radius: 10px;
}
.drift-clear-btn{
  border:none;
  background: rgba(0,0,0,0.08);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11px;
  cursor:pointer;
}
#nextUpBar{
  display:none;
  align-items:center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  margin: 10px 16px 0;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 12.5px;
  flex-wrap: wrap;
}
.nextup-label{ color: var(--ink-soft); font-size:11px;}
.nextup-title{ font-weight:700; }
.nextup-cd{ margin-left:auto; font-weight:700; color: var(--wine-deep); }
.nextup-cd.now{ color: var(--pink); }

.tabs{
  display:flex;
  margin: 16px 16px 0;
  background: var(--surface);
  border-radius: 14px;
  border: 1px solid var(--line);
  overflow:hidden;
}
.tab-btn{
  flex:1;
  border:none;
  background:transparent;
  padding: 12px 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-soft);
  cursor:pointer;
  font-family: inherit;
}
.tab-btn.active{
  background: var(--wine-deep);
  color:#fff;
}
.tab-panel{ padding: 14px 16px 0; }

.empty-state{
  text-align:center;
  color: var(--ink-soft);
  font-size: 13px;
  padding: 40px 20px;
  line-height: 1.8;
}

.student-chips{ display:flex; gap:8px; margin-bottom: 12px; flex-wrap:wrap; }
.student-chip{
  border: 1.5px solid var(--chip-color, var(--line));
  background: var(--surface);
  color: var(--chip-color, var(--ink));
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  cursor:pointer;
  font-family: inherit;
}
.student-chip.active{
  background: var(--chip-soft, var(--blush-soft));
}
.chip-star{ margin-right: 2px; }

.fav-card{
  display:flex;
  align-items:center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  position: relative;
}
.fav-card.is-now{
  border-color: var(--pink);
  box-shadow: 0 0 0 2px rgba(255,45,120,0.15);
}
.fav-time{
  font-family: "Cormorant Garamond", serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--wine-deep);
  min-width: 62px;
}
.fav-body{ flex:1; min-width:0; }
.fav-meta{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
.fav-title{ font-size: 14.5px; font-weight: 700; }
.fav-style{ color: var(--wine-soft); }
.fav-sub{ font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
.fav-heatdetail{ font-size: 11px; color: var(--wine-deep); margin-top: 4px; font-weight: 600; }

.roster-details{ margin-top: 6px; }
.roster-details summary{
  font-size: 11px;
  color: var(--wine-soft);
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}
.roster-details summary::-webkit-details-marker{ display:none; }
.roster-details summary::before{ content: "▸ "; }
.roster-details[open] summary::before{ content: "▾ "; }
.roster-list{
  margin-top: 6px;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.roster-row{
  display:flex;
  align-items:center;
  gap: 8px;
  padding: 6px 10px;
  font-size: 11.5px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.roster-row:last-child{ border-bottom:none; }
.roster-row.self{
  background: var(--blush-soft);
  font-weight: 700;
}
.roster-row.match{
  background: var(--gold-soft);
  font-weight: 700;
  box-shadow: inset 3px 0 0 var(--wine-deep);
}
.roster-no{ min-width: 22px; color: var(--wine-deep); font-weight:700; }
.roster-name{ flex:1; }
.roster-tag{
  display:inline-block;
  font-size: 9.5px;
  font-weight:700;
  color: var(--wine-deep);
  background: var(--gold-soft);
  padding: 1px 6px;
  border-radius: 999px;
  margin-left: 6px;
}
.roster-teacher{ color: var(--ink-soft); font-size: 10.5px; }
.live-roster{ margin-top: 10px; text-align:left; }
.fav-countdown{
  font-size: 12.5px;
  font-weight: 700;
  color: var(--wine-deep);
  white-space: nowrap;
}
.fav-countdown.now{ color: var(--pink); }
.fav-countdown.done{ color: var(--done-fg); }

.round-badge{
  display:inline-block;
  font-size: 10.5px;
  font-weight:700;
  padding: 2px 8px;
  border-radius: 999px;
}
.round-badge.prelim{ background: var(--prelim-badge-bg); color: var(--prelim-badge-fg); }
.round-badge.final{ background: var(--final-badge-bg); color: var(--final-badge-fg); }

.student-badge{
  display:inline-block;
  font-size: 10.5px;
  font-weight:700;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid transparent;
  margin-right: 2px;
}

.sync-btn{
  border:none;
  background: var(--reh-chip-bg);
  color: var(--wine-deep);
  font-size: 15px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor:pointer;
  flex-shrink:0;
}
.sync-btn.small{ width:28px; height:28px; font-size:13px; }

#timetableSearch{
  width:100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  margin-bottom: 12px;
  font-family: inherit;
}

#timetableSearchCount{
  font-size: 11.5px;
  font-weight: 700;
  color: var(--wine-deep);
  margin: -6px 2px 10px;
}

.match-badge{
  display:inline-block;
  font-size: 9.5px;
  font-weight: 700;
  color: var(--wine-deep);
  background: var(--gold-soft);
  padding: 1px 6px;
  border-radius: 999px;
  margin-left: 4px;
}

.tt-section{ margin-bottom: 10px; }
.tt-section-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 700;
  cursor:pointer;
  font-family: inherit;
  color: var(--ink);
}
.tt-section-body{
  padding-top: 8px;
}
.tt-item{ border-bottom: 1px solid var(--line); }
.tt-block{ border-bottom: 1px solid var(--line); }
.tt-row, .tt-block{
  display:flex;
  align-items:center;
  gap: 10px;
  padding: 9px 10px;
  font-size: 12.5px;
}
.tt-row.highlight, .tt-block.highlight{
  background: var(--blush-soft);
  border-radius: 10px;
}
.section-roster-details{ margin: 0 6px 8px; }
.section-roster-details summary{
  font-size: 11px;
  color: var(--wine-soft);
  font-weight: 700;
  cursor: pointer;
  list-style: none;
  padding: 2px 4px 6px;
}
.section-roster-details summary::-webkit-details-marker{ display:none; }
.section-roster-details summary::before{ content: "▸ "; }
.section-roster-details[open] summary::before{ content: "▾ "; }
.roster-group-label{
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-soft);
  margin: 6px 4px 2px;
}
.tt-time{ font-weight:700; min-width: 52px; color: var(--wine-deep); }
.tt-main{ flex:1; min-width:0; }
.tt-label{ font-weight: 600; }
.tt-style{ margin-left:6px; color: var(--ink-soft); }
.tt-heats{ font-size: 11px; color: var(--ink-soft); min-width: 26px; text-align:right; }
.tt-block-label{ flex:1; color: var(--ink-soft); font-weight:600; }
.tt-badges{ display:flex; gap:2px; flex-wrap:wrap; max-width: 130px; justify-content:flex-end; }

.live-card{
  background: var(--surface);
  border: 2px solid var(--pink);
  border-radius: 16px;
  padding: 20px;
  text-align:center;
  margin-bottom: 16px;
  position:relative;
}
.live-card.idle{ border-color: var(--line); }
.live-dot{
  width: 12px; height:12px;
  border-radius:50%;
  background: var(--pink);
  margin: 0 auto 8px;
  animation: blink 1.1s infinite;
}
@keyframes blink{
  0%,100%{ opacity:1; }
  50%{ opacity:.25; }
}
.live-label{ font-size:11px; color: var(--pink); font-weight:700; letter-spacing:2px; margin-bottom:6px;}
.live-time{ font-family:"Cormorant Garamond",serif; font-size:28px; font-weight:700; color: var(--wine-deep); }
.live-title{ font-size: 16px; font-weight:700; margin-top:4px; }
.live-heats{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.live-badges{ display:flex; gap:4px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
.live-card .sync-btn{ margin-top:12px; width:auto; height:auto; padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:700; }

.upcoming-heading{ font-size:12px; color: var(--ink-soft); font-weight:700; margin: 6px 0 8px; }
.upcoming-row{
  display:flex;
  gap: 10px;
  align-items:center;
  padding: 8px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
.upcoming-time{ font-weight:700; min-width:48px; color: var(--wine-soft); }
.upcoming-body{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.upcoming-title{ font-weight:600; }

#backToTop{
  display:none;
  position: fixed;
  bottom: 24px;
  right: 18px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--wine-deep);
  color:#fff;
  font-size: 18px;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  z-index: 50;
}

.confirm-overlay{
  display:none;
  position: fixed;
  inset:0;
  background: rgba(0,0,0,0.45);
  align-items:center;
  justify-content:center;
  z-index: 100;
  padding: 20px;
}
.confirm-card{
  background: var(--surface);
  border-radius: 16px;
  padding: 22px;
  max-width: 320px;
  width:100%;
  text-align:center;
}
#confirmMessage{
  font-size: 13.5px;
  line-height: 1.7;
  white-space: pre-line;
  margin-bottom: 18px;
  color: var(--ink);
}
.confirm-btn{
  width:100%;
  padding: 12px;
  border-radius: 10px;
  border:none;
  font-size: 14px;
  font-weight:700;
  margin-bottom: 8px;
  cursor:pointer;
  font-family: inherit;
}
.confirm-btn.ok{ background: var(--wine-deep); color:#fff; }
.confirm-btn.cancel{ background: var(--done-bg); color: var(--ink-soft); }

.break-actions-title{ font-size:15px; font-weight:700; margin-bottom:16px; }
.break-btn{
  width:100%;
  padding: 13px;
  border-radius: 10px;
  border:none;
  font-size: 14px;
  font-weight:700;
  margin-bottom: 10px;
  cursor:pointer;
  font-family: inherit;
}
.break-btn.map{ background:#00704A; color:#fff; }
.break-btn.order{ background:#fff; color:#00704A; border:2px solid #00704A; }
.break-actions-status{ font-size:11.5px; color: var(--ink-soft); min-height:14px; margin-bottom:4px;}

footer{
  text-align:center;
  font-size: 10.5px;
  color: var(--ink-soft);
  margin-top: 30px;
  padding: 0 20px;
}
</style>

</div>

<div class="tab-panel" id="panelCurrent" style="display:none;"></div>

<button id="backToTop" aria-label="上に戻る">↑</button>

<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-card">
    <div id="confirmMessage"></div>
    <button class="confirm-btn ok" id="confirmOkBtn">補正する</button>

</div>

<div id="starbucksOverlay" class="confirm-overlay">

    <button class="confirm-btn cancel" id="starbucksCloseBtn" style="margin-top:6px;">閉じる</button>
  </div>
</div>

<footer>NEXUS ENTERTAINMENT</footer>

<script>
const SCHEDULE = window.__SCHEDULE_DATA__;
const EVENT_ID = SCHEDULE.eventId || "event";
const FAV_KEY = "navi_fav_" + EVENT_ID;
const DRIFT_KEY = "navi_drift_" + EVENT_ID;
const THEME_KEY = "navi_theme_" + EVENT_ID;

const rows = SCHEDULE.rows;
const students = SCHEDULE.students;

let favStudents = loadFav();
let drift = loadDrift();
let activeTab = "fav";
let openSections = new Set();

function loadFav() {
  try {
    const raw = localStorage.getItem(FAV_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    return new Set();
  }
}
function saveFav() {
  try {
    localStorage.setItem(FAV_KEY, JSON.stringify([...favStudents]));
  } catch (e) {}
}
function loadDrift() {
  try {
    const raw = localStorage.getItem(DRIFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function saveDrift() {
  try {
    localStorage.setItem(DRIFT_KEY, JSON.stringify(drift));
  } catch (e) {}
}
function loadTheme() {
  try {
    return localStorage.getItem(THEME_KEY) || "light";
  } catch (e) {
    return "light";
  }
}
function saveTheme(t) {
  try {
    localStorage.setItem(THEME_KEY, t);
  } catch (e) {}
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  })[c]);
}

function fmtClock(minAbs) {
  let m = Math.round(minAbs);
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return h + ":" + String(mm).padStart(2, "0");
}

function adjusted(minAbs) {
  return minAbs + (drift ? drift.offsetMin : 0);
}

function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
}

// ---- sync / drift ----
function showConfirm(message) {
  return new Promise((resolve) => {
    const overlay = document.getElementById("confirmOverlay");
    const msgEl = document.getElementById("confirmMessage");
    const okBtn = document.getElementById("confirmOkBtn");
    const cancelBtn = document.getElementById("confirmCancelBtn");
    if (!overlay || !msgEl || !okBtn || !cancelBtn) {
      resolve(false);
      return;
    }
    msgEl.textContent = message;
    overlay.style.display = "flex";
    const cleanup = (result) => {
      overlay.style.display = "none";
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      overlay.removeEventListener("click", onOverlayClick);
      resolve(result);
    };
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    const onOverlayClick = (e) => {
      if (e.target === overlay) cleanup(false);
    };
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    overlay.addEventListener("click", onOverlayClick);
  });
}

function rowLabel(row) {
  if (row.kind === "heat") {
    return row.label + "　" + row.style;
  }
  return row.label;
}

function syncToRow(row) {
  const nowMin = nowMinutes();
  const offsetMin = Math.round(nowMin - row.startAbs);
  const label = rowLabel(row);
  const sign = offsetMin >= 0 ? "+" : "";
  showConfirm(`「${label}」（${fmtClock(row.startAbs)}）を基準に、${sign}${offsetMin}分補正します。\nよろしいですか？`).then(
    (confirmed) => {
      if (!confirmed) return;
      drift = { offsetMin, label };
      saveDrift();
      renderDriftBanner();
      refreshAllDisplays();
    }
  );
}

function clearDrift() {
  drift = null;
  saveDrift();
  renderDriftBanner();
  refreshAllDisplays();
}

function renderDriftBanner() {
  const el = document.getElementById("driftBanner");
  if (!el) return;
  if (!drift) {
    el.style.display = "none";
    el.innerHTML = "";
    return;
  }
  const sign = drift.offsetMin >= 0 ? "+" : "";
  el.style.display = "flex";
  el.innerHTML = `
    <span class="drift-text">📍 「${esc(drift.label)}」基準で ${sign}${drift.offsetMin}分 補正中</span>
    <button class="drift-clear-btn" id="driftClearBtn">解除</button>
  `;
  const btn = document.getElementById("driftClearBtn");
  if (btn) btn.addEventListener("click", clearDrift);
}

// ---- kind badges ----
const ROUND_LABEL = { 予選: "予選", 決勝: "決勝" };

function studentBadgesHtml(list, opts) {
  if (!list || list.length === 0) return "";
  const showHeat = opts && opts.showHeat;
  return list
    .map((entry) => {
      const name = entry.name;
      const s = students[name];
      const bg = s ? s.colorSoft : "#eee";
      const fg = s ? s.color : "#666";
      const heatSuffix = showHeat && entry.heatLabel ? ` ${entry.heatLabel}` : "";
      return `<span class="student-badge" style="background:${bg};color:${fg};border-color:${fg}33">${esc(name)}${esc(heatSuffix)}</span>`;
    })
    .join("");
}

function rosterHtml(relevantStudents) {
  const withRoster = relevantStudents.filter((s) => s.roster && s.roster.length);
  if (withRoster.length === 0) return "";
  return withRoster
    .map((s) => {
      const rows = s.roster
        .map((e) => {
          const isSelf = e.entryNo === s.entryNo;
          return `<div class="roster-row ${isSelf ? "self" : ""}">
            <span class="roster-no">${esc(e.entryNo)}</span>
            <span class="roster-name">${esc(e.name)}</span>
            <span class="roster-teacher">${esc(e.teacher)}</span>
          </div>`;
        })
        .join("");
      return `<details class="roster-details">
        <summary>${esc(s.name)}の${esc(s.heatLabel)}（同ヒートの出場者）</summary>
        <div class="roster-list">${rows}</div>
      </details>`;
    })
    .join("");
}

const ENTRY_NO_TO_STUDENT = {};
Object.keys(students).forEach((name) => {
  ENTRY_NO_TO_STUDENT[students[name].entryNo] = name;
});

function sectionRosterHtml(row, q, autoExpand) {
  if (!row.sectionRoster || row.sectionRoster.length === 0) return "";
  let matched = false;
  const groups = row.sectionRoster
    .map((g) => {
      const entries = g.entries
        .map((e) => {
          const studentName = ENTRY_NO_TO_STUDENT[e.entryNo];
          const isTracked = !!studentName;
          const isMatch =
            !!q &&
            (e.name.includes(q) ||
              String(e.entryNo).includes(q) ||
              (e.teacher && e.teacher.includes(q)));
          if (isMatch) matched = true;
          return `<div class="roster-row ${isTracked ? "self" : ""} ${isMatch ? "match" : ""}">
            <span class="roster-no">${esc(e.entryNo)}</span>
            <span class="roster-name">${esc(e.name)}${isTracked ? `<span class="roster-tag">${esc(studentName)}</span>` : ""}</span>
            <span class="roster-teacher">${esc(e.teacher)}</span>
          </div>`;
        })
        .join("");
      return `<div class="roster-group-label">${esc(g.heatLabel)}</div><div class="roster-list">${entries}</div>`;
    })
    .join("");
  const shouldOpen = matched && autoExpand;
  return `<details class="section-roster-details ${matched ? "has-match" : ""}" ${shouldOpen ? "open" : ""}><summary>この区分の出場者を見る${matched && !autoExpand ? ' <span class="match-badge">該当あり</span>' : ""}</summary>${groups}</details>`;
}

function roundBadgeHtml(round) {
  if (!round) return "";
  const cls = round === "決勝" ? "final" : "prelim";
  return `<span class="round-badge ${cls}">${round}</span>`;
}

function countdownText(row) {
  const nowMin = nowMinutes();
  const start = adjusted(row.startAbs);
  const end = adjusted(row.endAbs);
  if (nowMin >= start && nowMin < end) {
    return { text: "進行中", cls: "now" };
  }
  const diff = start - nowMin;
  if (diff < 0) {
    return { text: "終了", cls: "done" };
  }
  const mins = Math.ceil(diff);
  if (mins <= 0) return { text: "まもなく", cls: "soon" };
  return { text: `あと${mins}分`, cls: mins <= 5 ? "soon" : "" };
}

// ---- favorites tab ----
function favSortKey(row, nowMin) {
  const start = adjusted(row.startAbs);
  const end = adjusted(row.endAbs);
  if (nowMin >= start && nowMin < end) return -2;
  if (nowMin < start) return start;
  return 100000 + end;
}

function toggleFavStudent(name) {
  if (favStudents.has(name)) favStudents.delete(name);
  else favStudents.add(name);
  saveFav();
  renderStudentChips();
  renderFavPanel();
  renderNextUpBar();
}

function renderStudentChips() {
  const el = document.getElementById("studentChips");
  if (!el) return;
  el.innerHTML = Object.keys(students)
    .map((name) => {
      const s = students[name];
      const active = favStudents.has(name);
      return `<button class="student-chip ${active ? "active" : ""}" data-student="${esc(name)}"
        style="--chip-color:${s.color};--chip-soft:${s.colorSoft}">
        <span class="chip-star">${active ? "★" : "☆"}</span> ${esc(name)}
      </button>`;
    })
    .join("");
  el.querySelectorAll(".student-chip").forEach((btn) => {
    btn.addEventListener("click", () => toggleFavStudent(btn.dataset.student));
  });
}

function renderFavPanel() {
  const panel = document.getElementById("panelFavList");
  if (!panel) return;
  const nowMin = nowMinutes();
  if (favStudents.size === 0) {
    panel.innerHTML = `<div class="empty-state">まだお気に入りが登録されていません。上で応援したい生徒様を選んでください。<br>★マークで選択できます。</div>`;
    return;
  }
  const matched = rows.filter(
    (r) => r.kind === "heat" && r.students.some((s) => favStudents.has(s.name))
  );
  matched.sort((a, b) => favSortKey(a, nowMin) - favSortKey(b, nowMin));
  if (matched.length === 0) {
    panel.innerHTML = `<div class="empty-state">選択した生徒様が出場するヒートが見つかりませんでした。</div>`;
    return;
  }
  panel.innerHTML = matched
    .map((r) => {
      const cd = countdownText(r);
      const relevantStudents = r.students.filter((s) => favStudents.has(s.name));
      const heatDetail = relevantStudents
        .filter((s) => s.heatLabel)
        .map((s) => `${esc(s.name)}：${esc(s.heatLabel)}（${s.groups}組中）　No.${esc(s.entryNo)}`)
        .join("　");
      return `
      <div class="fav-card ${cd.cls === "now" ? "is-now" : ""}">
        <div class="fav-time">${fmtClock(adjusted(r.startAbs))}</div>
        <div class="fav-body">
          <div class="fav-meta">${roundBadgeHtml(r.round)} ${studentBadgesHtml(relevantStudents, { showHeat: true })}</div>
          <div class="fav-title">${esc(r.label)}　<span class="fav-style">${esc(r.style)}</span></div>
          <div class="fav-sub">${esc(r.heats || "")}</div>
          ${heatDetail ? `<div class="fav-heatdetail">${heatDetail}</div>` : ""}
        </div>
        <div class="fav-countdown ${cd.cls}">${cd.text}</div>
        <button class="sync-btn" data-sync="${r.id}" title="今ここを基準に時刻を補正">📍</button>
      </div>`;
    })
    .join("");
  panel.querySelectorAll(".sync-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const row = rows.find((r) => r.id === btn.dataset.sync);
      if (row) syncToRow(row);
    });
  });
}

// ---- timetable tab ----
const PART_NAMES = {};
rows.forEach((r) => {
  if (r.kind === "part") {
    if (!(r.partIndex in PART_NAMES)) PART_NAMES[r.partIndex] = [];
  }
});

function buildSections() {
  const sections = [];
  let current = null;
  rows.forEach((r) => {
    if (r.kind === "part") {
      current = { title: r.label, items: [] };
      sections.push(current);
    } else {
      if (!current) {
        current = { title: "", items: [] };
        sections.push(current);
      }
      current.items.push(r);
    }
  });
  return sections;
}
const SECTIONS = buildSections();

function timetableRowHtml(r, q, autoExpand) {
  if (r.kind === "block") {
    const hasStudents = r.students && r.students.length > 0;
    return `<div class="tt-block ${hasStudents ? "highlight" : ""}">
      <div class="tt-time">${fmtClock(adjusted(r.startAbs))}</div>
      <div class="tt-block-label">${esc(r.label)}</div>
      <div class="tt-badges">${studentBadgesHtml(r.students)}</div>
      <button class="sync-btn small" data-sync="${r.id}" title="今ここを基準に時刻を補正">📍</button>
    </div>`;
  }
  const hasStudents = r.students && r.students.length > 0;
  return `<div class="tt-item">
    <div class="tt-row ${hasStudents ? "highlight" : ""}">
      <div class="tt-time">${fmtClock(adjusted(r.startAbs))}</div>
      <div class="tt-main">
        <span class="tt-label">${esc(r.label)}</span>
        <span class="tt-style">${esc(r.style)}</span>
      </div>
      <div class="tt-heats">${esc(r.heats || "")}</div>
      <div class="tt-badges">${studentBadgesHtml(r.students)}</div>
      <button class="sync-btn small" data-sync="${r.id}" title="今ここを基準に時刻を補正">📍</button>
    </div>
    ${sectionRosterHtml(r, q, autoExpand)}
  </div>`;
}

// A search hit almost always means "this row is in the filtered list" (since we
// only show matching rows). Auto-expanding every matching row's full roster reads
// fine for a couple of hits, but a broad query (a popular teacher's name, say)
// can match dozens of heats — auto-opening all of them turns the screen into a
// wall of roster lists. Past this threshold we leave rosters collapsed and let
// the person tap into the ones they actually want to see.
const SEARCH_AUTO_EXPAND_MAX = 3;

function rowMatchesQuery(r, q) {
  if (!q) return false;
  if (r.students && r.students.some((s) => s.name.includes(q))) return true;
  if (r.sectionRoster) {
    return r.sectionRoster.some((g) =>
      g.entries.some(
        (e) =>
          e.name.includes(q) ||
          String(e.entryNo).includes(q) ||
          (e.teacher && e.teacher.includes(q))
      )
    );
  }
  return false;
}

function renderTimetablePanel(filterText) {
  const panel = document.getElementById("timetableSections");
  if (!panel) return;
  const countEl = document.getElementById("timetableSearchCount");
  const q = (filterText || "").trim();

  let matchedRowsTotal = 0;
  if (q) {
    SECTIONS.forEach((sec) => {
      sec.items.forEach((r) => {
        if (rowMatchesQuery(r, q)) matchedRowsTotal++;
      });
    });
  }
  const autoExpand = matchedRowsTotal > 0 && matchedRowsTotal <= SEARCH_AUTO_EXPAND_MAX;

  if (countEl) {
    if (!q) {
      countEl.style.display = "none";
      countEl.textContent = "";
    } else {
      countEl.style.display = "block";
      countEl.textContent =
        matchedRowsTotal > 0
          ? `${matchedRowsTotal}件ヒット${autoExpand ? "" : "（各区分をタップして確認）"}`
          : "該当する出場者が見つかりません";
    }
  }

  panel.innerHTML = SECTIONS.map((sec, idx) => {
    let items = sec.items;
    if (q) {
      items = items.filter((r) => rowMatchesQuery(r, q));
      if (items.length === 0) return "";
    }
    const isOpen = openSections.has(idx) || !!q;
    return `
      <div class="tt-section">
        <button class="tt-section-header" data-section="${idx}">
          <span>${esc(sec.title || "その他")}</span>
          <span class="tt-caret">${isOpen ? "▾" : "▸"}</span>
        </button>
        <div class="tt-section-body" style="display:${isOpen ? "block" : "none"}">
          ${items.map((r) => timetableRowHtml(r, q, autoExpand)).join("")}
        </div>
      </div>`;
  }).join("");
  panel.querySelectorAll(".tt-section-header").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.section, 10);
      if (openSections.has(idx)) openSections.delete(idx);
      else openSections.add(idx);
      renderTimetablePanel(document.getElementById("timetableSearch").value);
    });
  });
  panel.querySelectorAll(".sync-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const row = rows.find((r) => r.id === btn.dataset.sync);
      if (row) syncToRow(row);
    });
  });
}

// ---- current / live tab ----
function renderCurrentPanel() {
  const panel = document.getElementById("panelCurrent");
  if (!panel) return;
  const nowMin = nowMinutes();
  const moments = rows.filter((r) => r.kind === "heat" || r.kind === "block");
  const currentIdx = moments.findIndex(
    (m) => nowMin >= adjusted(m.startAbs) && nowMin < adjusted(m.endAbs)
  );
  const current = currentIdx >= 0 ? moments[currentIdx] : null;
  let upcoming;
  if (currentIdx >= 0) {
    upcoming = moments.slice(currentIdx + 1, currentIdx + 6);
  } else {
    const nextIdx = moments.findIndex((m) => adjusted(m.startAbs) > nowMin);
    upcoming = nextIdx >= 0 ? moments.slice(nextIdx, nextIdx + 5) : [];
  }

  let liveHtml = "";
  if (current) {
    const isHeat = current.kind === "heat";
    liveHtml = `
      <div class="live-card">
        <div class="live-dot"></div>
        <div class="live-label">現在進行中</div>
        <div class="live-time">${fmtClock(adjusted(current.startAbs))}〜${fmtClock(adjusted(current.endAbs))}</div>
        <div class="live-title">${esc(current.label)}${isHeat ? "　" + esc(current.style) : ""}</div>
        ${isHeat ? `<div class="live-heats">${esc(current.heats || "")}</div>` : ""}
        <div class="live-badges">${roundBadgeHtml(current.round)} ${studentBadgesHtml(current.students, { showHeat: true })}</div>
        ${current.students && current.students.length ? `<div class="live-roster">${rosterHtml(current.students)}</div>` : ""}
        <button class="sync-btn" data-sync="${current.id}" title="今ここを基準に時刻を補正">📍今ここ</button>
      </div>`;
  } else {
    liveHtml = `<div class="live-card idle"><div class="live-title">現在進行中の項目はありません</div></div>`;
  }

  const upcomingHtml = upcoming
    .map((m, i) => {
      const opacity = (0.95 - i * 0.08).toFixed(2);
      const isHeat = m.kind === "heat";
      return `
      <div class="upcoming-row" style="opacity:${opacity}">
        <div class="upcoming-time">${fmtClock(adjusted(m.startAbs))}</div>
        <div class="upcoming-body">
          <span class="upcoming-title">${esc(m.label)}${isHeat ? "　" + esc(m.style) : ""}</span>
          ${roundBadgeHtml(m.round)}
          ${studentBadgesHtml(m.students, { showHeat: true })}
        </div>
      </div>`;
    })
    .join("");

  panel.innerHTML =
    liveHtml + (upcoming.length ? `<div class="upcoming-heading">このあと</div>${upcomingHtml}` : "");

  const btn = panel.querySelector(".sync-btn");
  if (btn) {
    btn.addEventListener("click", () => {
      const row = rows.find((r) => r.id === btn.dataset.sync);
      if (row) syncToRow(row);
    });
  }
}

// ---- next-up bar ----
function renderNextUpBar() {
  const el = document.getElementById("nextUpBar");
  if (!el) return;
  if (favStudents.size === 0) {
    el.style.display = "none";
    return;
  }
  const nowMin = nowMinutes();
  const matched = rows.filter(
    (r) => r.kind === "heat" && r.students.some((s) => favStudents.has(s.name))
  );
  const upcoming = matched
    .filter((r) => adjusted(r.endAbs) > nowMin)
    .sort((a, b) => favSortKey(a, nowMin) - favSortKey(b, nowMin))[0];
  if (!upcoming) {
    el.style.display = "none";
    return;
  }
  const cd = countdownText(upcoming);
  el.style.display = "flex";
  el.innerHTML = `<span class="nextup-label">次の出番</span> <span class="nextup-title">${esc(
    upcoming.label
  )} ${esc(upcoming.style)}</span> <span class="nextup-cd ${cd.cls}">${cd.text}</span>`;
}

function refreshAllDisplays() {
  renderFavPanel();
  renderTimetablePanel(document.getElementById("timetableSearch") ? document.getElementById("timetableSearch").value : "");
  renderCurrentPanel();
  renderNextUpBar();
}

// ---- tabs ----
function setActiveTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === tab);
  });
  document.querySelectorAll(".tab-panel").forEach((p) => {
    p.style.display = p.id === "panel" + capitalize(tab) ? "block" : "none";
  });
  if (tab === "fav") renderFavPanel();
  if (tab === "timetable") renderTimetablePanel(document.getElementById("timetableSearch").value);
  if (tab === "current") renderCurrentPanel();
}
function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ---- theme ----
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("themeToggle");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}

// ---- back to top ----
function initBackToTop() {
  const btn = document.getElementById("backToTop");
  if (!btn) return;
  window.addEventListener("scroll", () => {
    btn.style.display = window.scrollY > 300 ? "flex" : "none";
  });
  btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
}

// ---- starbucks ----
function findNearbyStarbucks() {
  const statusEl = document.getElementById("starbucksStatus");
  if (!navigator.geolocation) {
    if (statusEl) statusEl.textContent = "位置情報が使えないため、周辺検索で開きます";
    window.open("https://www.google.com/maps/search/?api=1&query=スターバックス", "_blank");
    return;
  }
  if (statusEl) statusEl.textContent = "現在地を取得中...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const url = `https://www.google.com/maps/search/starbucks/@${lat},${lng},15z`;
      if (statusEl) statusEl.textContent = "";
      window.open(url, "_blank");
    },
    () => {
      if (statusEl) statusEl.textContent = "位置情報を取得できなかったため、周辺検索で開きます";
      window.open("https://www.google.com/maps/search/?api=1&query=スターバックス", "_blank");
    },
    { enableHighAccuracy: false, timeout: 8000 }
  );
}
function openStarbucksOrder() {
  window.open("https://www.starbucks.co.jp/mobileorder/guide/", "_blank");
}

function initStarbucks() {
  const headerBtn = document.getElementById("starbucksHeaderBtn");
  const overlay = document.getElementById("starbucksOverlay");
  if (!headerBtn || !overlay) return;
  headerBtn.addEventListener("click", () => {
    const statusEl = document.getElementById("starbucksStatus");
    if (statusEl) statusEl.textContent = "";
    overlay.style.display = "flex";
  });
  const closeBtn = document.getElementById("starbucksCloseBtn");
  if (closeBtn) closeBtn.addEventListener("click", () => (overlay.style.display = "none"));
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) overlay.style.display = "none";
  });
  const mapBtn = document.getElementById("findStarbucksBtn");
  const orderBtn = document.getElementById("starbucksOrderBtn");
  if (mapBtn) mapBtn.addEventListener("click", findNearbyStarbucks);
  if (orderBtn) orderBtn.addEventListener("click", openStarbucksOrder);
}

// ---- init ----
function init() {
  document.getElementById("eventTitle").textContent = SCHEDULE.eventName;
  document.getElementById("eventMeta").textContent =
    SCHEDULE.eventDate + "　" + SCHEDULE.eventVenue;
  if (SCHEDULE.note) {
    const noteEl = document.getElementById("eventNote");
    if (noteEl) noteEl.textContent = SCHEDULE.note;
  }

  applyTheme(loadTheme());
  const themeBtn = document.getElementById("themeToggle");
  if (themeBtn) {
    themeBtn.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      applyTheme(next);
      saveTheme(next);
    });
  }

  document.querySelectorAll(".tab-btn").forEach((b) => {
    b.addEventListener("click", () => setActiveTab(b.dataset.tab));
  });

  renderStudentChips();
  renderDriftBanner();
  setActiveTab("fav");

  const searchEl = document.getElementById("timetableSearch");
  if (searchEl) {
    searchEl.addEventListener("input", () => renderTimetablePanel(searchEl.value));
  }

  initBackToTop();
  initStarbucks();

  setInterval(() => {
    if (activeTab === "fav") renderFavPanel();
    if (activeTab === "current") renderCurrentPanel();
    renderNextUpBar();
  }, 15000);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
}

document.addEventListener("DOMContentLoaded", init);

</script>
