<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>本日の進行表 — 中川雄太ダンスアカデミー14周年</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00A86B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine: #00A86B;
  --wine-deep: #046A44;
  --wine-soft: #1F8055;
  --blush: #BEEED9;
  --blush-soft: #EAFBF3;
  --cream: #F7FCFA;
  --gold: #FFC93C;
  --gold-soft: #FFE9AE;
  --teal: #FF2D78;
  --ink: #12271C;
  --ink-soft: #4C6B5C;
  --line: #D7EEE1;
  --mini-badge-bg: #FFF1CC;
  --mini-badge-fg: #7A5A12;
  --solo-badge-bg: #D9F3E6;
  --solo-badge-fg: #046A44;
  --mix-badge-bg: #FFE1EC;
  --mix-badge-fg: #C21F5B;
  --shadow: 0 6px 20px rgba(4,106,68,0.10);
  --radius: 14px;
  --surface: #fff;
  --reh-chip-bg: #F3EEE9;
  --star-inactive: #d8c3c9;
  --done-bg: #eee;
  --done-fg: #999;
  color-scheme: light;
}
[data-theme="dark"]{
  --blush-soft: #17201A;
  --cream: #0D130E;
  --ink: #EAF3EE;
  --ink-soft: #8FA69B;
  --line: #263029;
  --wine-soft: #7FDDB2;
  --mini-badge-bg: #3A331A;
  --mini-badge-fg: #FFD666;
  --solo-badge-bg: #16362A;
  --solo-badge-fg: #6FE0AC;
  --mix-badge-bg: #3A1826;
  --mix-badge-fg: #FF7FAE;
  --surface: #1C2620;
  --reh-chip-bg: #232A24;
  --star-inactive: #3E4C45;
  --done-bg: #232A24;
  --done-fg: #7C9186;
  --shadow: 0 6px 20px rgba(0,0,0,0.4);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--cream);
  background-image:
    radial-gradient(ellipse 900px 500px at 10% -10%, var(--blush-soft) 0%, transparent 60%),
    radial-gradient(ellipse 700px 400px at 110% 10%, var(--gold-soft) 0%, transparent 55%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Zen Kaku Gothic New", sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: 48px;
}
.heading-font{ font-family: "Cormorant Garamond", "Shippori Mincho", serif; }

/* ---------- header ---------- */
header.app-header{
  position: sticky; top:0; z-index: 40;
  background: linear-gradient(180deg, var(--wine) 0%, var(--wine-deep) 100%);
  color: var(--blush-soft);
  padding: 14px 20px 16px;
  box-shadow: 0 4px 16px rgba(4,58,38,0.25);
}
.header-inner{ max-width: 640px; margin: 0 auto; position: relative; }
.theme-toggle{
  position: absolute; top: 0; right: 0;
  width: 34px; height: 34px; border-radius: 50%;
  border: none; cursor: pointer;
  background: rgba(255,255,255,.15); color: #fff;
  display:flex; align-items:center; justify-content:center;
}
.theme-toggle svg{ width:18px; height:18px; }
.theme-toggle:active{ background: rgba(255,255,255,.3); }
.eyebrow{
  font-size: 11px; letter-spacing: .12em; color: var(--gold-soft);
  display:flex; align-items:center; gap:8px; margin-bottom: 2px;
}
.eyebrow svg{ width:12px; height:12px; flex-shrink:0; }
h1.title{
  margin: 0; font-size: 26px; font-weight: 600; color: #fff;
  letter-spacing: .01em;
}
h1.title em{ font-style: italic; color: var(--gold-soft); }
.clock-row{
  display:flex; align-items:baseline; justify-content: space-between;
  margin-top: 10px;
}
.clock{ font-size: 13px; color: var(--blush-soft); opacity:.92; }
.clock strong{ font-size:16px; font-weight:700; color:#fff; font-variant-numeric: tabular-nums; }

/* ---------- tabs ---------- */
.tabs{
  max-width: 640px; margin: 14px auto 0; padding: 0 16px;
  display:flex; gap:8px;
}
.tab-btn{
  flex:1; border:none; cursor:pointer;
  padding: 11px 10px; border-radius: 999px;
  font-family: inherit; font-size: 14px; font-weight:700;
  background: var(--surface); color: var(--wine-soft);
  border: 1px solid var(--line);
  transition: all .15s ease;
}
.tab-btn.active{
  background: var(--wine); color:#fff; border-color: var(--wine);
  box-shadow: var(--shadow);
}
.tab-btn .count{
  display:inline-block; margin-left:5px; font-size:11px;
  background: rgba(255,255,255,.25); border-radius: 10px; padding: 1px 6px;
}
.tab-btn.active .count{ background: rgba(255,255,255,.28); }
.tab-btn:not(.active) .count{ background: var(--blush-soft); color:var(--wine-soft); }

main{ max-width: 640px; margin: 0 auto; padding: 16px; }

/* ---------- next-up / drift banners ---------- */
.next-up-bar{
  max-width: 640px; margin: 12px auto 0; padding: 10px 16px;
  background: var(--gold); color: #fff; border-radius: 12px;
  font-size: 13.5px; font-weight:700; display:flex; align-items:center; gap:8px;
  box-shadow: var(--shadow);
}
.drift-banner{
  max-width: 640px; margin: 10px auto 0; padding: 9px 16px;
  background: var(--blush-soft); color: var(--wine-soft); border-radius: 12px;
  font-size: 12.5px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.drift-banner button{
  border:none; background: var(--wine); color:#fff; border-radius:999px;
  padding: 4px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex-shrink:0;
}
.sync-btn{
  border:none; background: none; cursor:pointer; font-size:15px; line-height:1;
  padding: 2px 6px; margin-left: auto; color: var(--ink-soft); border-radius: 8px;
}
.sync-btn:active{ background: var(--blush-soft); }

/* ---------- favorites tab ---------- */
.empty-state{
  text-align:center; padding: 52px 24px; color: var(--ink-soft);
}
.empty-state .icon{ font-size: 34px; margin-bottom: 10px; }
.empty-state p{ margin: 4px 0; line-height:1.7; font-size: 14px; }
.empty-state button{
  margin-top: 16px; border:none; cursor:pointer;
  background: var(--wine); color:#fff; padding: 11px 22px;
  border-radius: 999px; font-family:inherit; font-weight:700; font-size:14px;
  box-shadow: var(--shadow);
}

.fav-card{
  background:var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 16px 14px; margin-bottom: 12px; border: 1px solid var(--line);
  position: relative; overflow:hidden;
}
.fav-top{ display:flex; align-items:flex-start; gap:10px; }
.fav-info{ flex:1; min-width:0; }
.fav-order-label{ font-family: "Zen Kaku Gothic New", sans-serif; font-size: 21px; font-weight:700; color: var(--wine); letter-spacing:.02em; }
.fav-name{ font-size: 19px; font-weight:700; color: var(--wine-deep); line-height:1.4; margin-top:2px; }
.fav-meta{ font-size:13px; color: var(--ink-soft); margin-top:3px; line-height:1.5; }
.honorific{ font-size: 0.68em; font-weight:500; opacity:.75; }
.fav-star-btn{
  border:none; background:none; cursor:pointer; font-size:22px; line-height:1;
  padding:2px 4px; color: var(--gold); flex-shrink:0;
}
.fav-phase-block{
  margin-top: 12px; padding: 12px 14px; border-radius: 12px;
  background: var(--blush-soft); border: 1px solid var(--line);
}
.fav-phase-block.is-now{ background: var(--gold); border-color: var(--gold); }
.fav-phase-block.is-now .phase-label{ color: #fff; }
.fav-phase-block.is-done{ opacity:.5; }
.fav-phase-block.compact{
  padding: 4px 2px; background: transparent; border: none; box-shadow: none;
  margin-top: 4px;
}
.fav-phase-block.compact .phase-label{ display: none; }
.fav-phase-block + .fav-phase-block{ margin-top: 8px; }
.fav-phase-block.compact + .fav-phase-block.compact{ margin-top: 2px; }
.badge-compact{ font-size: 12.5px; color: var(--ink-soft); font-weight:600; }
.phase-label{ font-size:11.5px; font-weight:700; color: var(--wine-soft); letter-spacing:.04em; margin-bottom:4px; }
.phase-body{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
.phase-body .num{ font-size: 38px; font-weight:700; color: var(--wine); font-variant-numeric: tabular-nums; line-height:1; }
.phase-body .unit{ font-size: 14px; color: var(--ink-soft); font-weight:700; }
.phase-body .clocktime{ font-size:12.5px; color: var(--ink-soft); }
.phase-body .badge{ display:inline-block; font-size:14px; font-weight:700; border-radius:999px; padding: 5px 14px; }
.phase-body .badge.now{ background: rgba(255,255,255,.9); color: var(--wine); }
.phase-body .badge.done{ background: var(--done-bg); color: var(--done-fg); }

/* ---------- search ---------- */
.search-wrap{ position: relative; margin-bottom: 16px; }
.search-wrap input{
  width:100%; padding: 12px 16px 12px 40px; border-radius: 999px;
  border: 1px solid var(--line); background:var(--surface); font-family:inherit;
  font-size: 15px; color: var(--ink); box-shadow: var(--shadow);
}
.search-wrap input:focus{ outline: 2px solid var(--gold); outline-offset:1px; }
.search-wrap .icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color: var(--wine-soft); }
.search-results{ margin-bottom: 18px; }
.search-hint{ font-size:12.5px; color: var(--ink-soft); padding: 2px 4px 10px; }
.search-item-row{ background:var(--surface); border-radius:12px; box-shadow:var(--shadow); margin-bottom:8px; border:1px solid var(--line); }

/* ---------- overview chips ---------- */
.overview-scroll{
  display:flex; gap:8px; overflow-x:auto; padding: 2px 2px 16px; margin-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.overview-chip{
  flex-shrink:0; background:var(--surface); border:1px solid var(--line); border-radius: 12px;
  padding: 9px 13px; min-width: 108px; text-align:center; cursor:pointer;
  transition: border-color .15s;
}
.overview-chip:active{ border-color: var(--wine); }
.overview-chip .label{ font-size:11px; color:var(--ink-soft); font-weight:700; }
.overview-chip .t{ font-size:14px; font-weight:700; color: var(--wine); font-variant-numeric: tabular-nums; margin-top:2px; }
.overview-chip .t2{ font-size:11px; font-weight:700; color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-top:1px; }

/* ---------- timetable list ---------- */
.part-section{ margin-bottom: 10px; border-radius: var(--radius); overflow:hidden; box-shadow: var(--shadow); background:var(--surface); border:1px solid var(--line); }
.part-header{
  padding: 14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
  background: linear-gradient(135deg, var(--wine) 0%, var(--wine-soft) 100%); color:#fff;
}
.part-header .htitle{ font-size:15px; font-weight:700; }
.part-header .htitle small{ display:block; font-weight:400; font-size:11.5px; color: var(--gold-soft); margin-top:2px; }
.part-header .chevron{ transition: transform .2s; flex-shrink:0; }
.part-header.open .chevron{ transform: rotate(180deg); }
.part-body{ display:none; }
.part-body.open{ display:block; }
.break-row{
  padding: 10px 16px; background: var(--blush-soft); color: var(--wine-soft);
  font-size:12.5px; font-weight:700; display:flex; justify-content:space-between;
  border-bottom: 1px solid var(--line);
}
.item-row{ padding: 14px 16px; border-bottom: 1px solid var(--line); }
.item-row:last-child{ border-bottom:none; }
.item-row-flex{ display:flex; gap:12px; align-items:flex-start; margin-bottom:8px; }
.item-no-badge{
  flex-shrink:0; width: 44px; height: 44px; border-radius: 10px;
  background: var(--blush-soft); color: var(--wine-soft);
  display:flex; align-items:center; justify-content:center;
  font-size: 22px; font-weight:700; font-variant-numeric: tabular-nums;
  border: 1px solid var(--line);
}
.item-headinfo{ min-width:0; flex:1; }
.item-times{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom: 4px; }
.time-chip{ font-size:14.5px; font-weight:700; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 8px; }
.time-chip.reh{ color: var(--ink-soft); background: var(--reh-chip-bg); }
.time-chip.show{ color: var(--wine); background: var(--blush-soft); }
.kind-badge{ font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 8px; }
.kind-badge.mini{ background: var(--mini-badge-bg); color: var(--mini-badge-fg); }
.kind-badge.solo{ background: var(--solo-badge-bg); color: var(--solo-badge-fg); }
.kind-badge.mix{ background: var(--mix-badge-bg); color: var(--mix-badge-fg); }
.kind-badge.special{ background: var(--wine); color: #fff; }
.item-event{ font-size:13.5px; color: var(--ink-soft); }
.performer-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 6px 0 6px 56px; }
.performer-info{ min-width:0; }
.performer-name{ font-size:15px; font-weight:700; color: var(--ink); }
.performer-teacher{ font-size:12px; color: var(--ink-soft); }
.star-btn{
  border:none; background:none; cursor:pointer; font-size:21px; line-height:1; flex-shrink:0;
  color: var(--star-inactive); padding: 3px 5px;
}
.star-btn.active{ color: var(--gold); }
.proshow-row{
  padding: 14px 16px; background: var(--wine-deep); color: var(--gold-soft);
  font-size:13px; font-weight:700; text-align:center;
}
.proshow-row small{ display:block; font-weight:400; color: var(--blush-soft); margin-top:3px; font-size:11.5px;}
.proshow-row.pro-rehearsal-row{ background: var(--wine-soft); color: var(--gold-soft); }

/* ---------- footer ---------- */
.credit-wrap{ max-width: 640px; margin: 28px auto 0; padding: 0 16px; display:flex; justify-content:center; }
.credit-card{
  background: #14151c; border-radius: 18px; padding: 16px 28px;
  box-shadow: 0 10px 26px rgba(0,0,0,.28); text-align:center;
}
.credit-card .mark-row{ display:flex; align-items:center; justify-content:center; gap:10px; }
.credit-card svg{ width:22px; height:22px; flex-shrink:0; }
.credit-card .brand{
  font-family: "Cormorant Garamond", "Shippori Mincho", serif;
  font-size: 17px; font-weight:700; letter-spacing:.14em; color:#F5EFE6;
}
.credit-card .tagline{ margin-top:7px; font-size:11.5px; color:#9a97a3; letter-spacing:.02em; }

.back-to-top{
  position: fixed; right: 18px; bottom: 20px; z-index: 50;
  width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--wine); color: #fff; box-shadow: 0 6px 16px rgba(4,58,38,0.35);
  display:flex; align-items:center; justify-content:center;
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
}
.back-to-top.visible{ opacity: 1; visibility: visible; transform: translateY(0); }
.back-to-top svg{ width: 20px; height: 20px; }

.confirm-overlay{
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4,58,38,0.55);
  display:flex; align-items:center; justify-content:center;
  padding: 24px;
}
.confirm-card{
  background: var(--surface); border-radius: 16px; padding: 22px 20px;
  max-width: 340px; width: 100%; box-shadow: 0 12px 32px rgba(4,58,38,0.3);
  text-align:center;
}
.confirm-message{
  font-size: 15px; color: var(--ink); line-height:1.7; margin: 0 0 18px; white-space: pre-line;
}
.confirm-actions{ display:flex; gap:10px; }
.confirm-btn{
  flex:1; border:none; cursor:pointer; padding: 11px 10px; border-radius: 999px;
  font-family: inherit; font-size: 14px; font-weight:700;
}
.confirm-btn.cancel{ background: var(--blush-soft); color: var(--wine-soft); }
.confirm-btn.ok{ background: var(--wine); color:#fff; }

/* ---------- current (LIVE) tab ---------- */
.live-dot{
  display:inline-block; width:10px; height:10px; border-radius:50%;
  background:#FF3B30; margin-right:6px; flex-shrink:0;
  animation: livePulse 1.1s ease-in-out infinite;
}
@keyframes livePulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.3; transform:scale(.8); } }
.live-card{
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px 18px; border: 1px solid var(--line); text-align:center;
}
.live-eyebrow{
  display:flex; align-items:center; justify-content:center; gap:2px;
  font-size:12.5px; font-weight:700; color:#FF3B30; letter-spacing:.06em; margin-bottom:10px;
}
.live-order{ font-size:20px; font-weight:700; color: var(--wine); }
.live-event{ font-size:14px; color: var(--ink-soft); margin-top:2px; }
.live-performers{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.live-performer-name{ font-size:18px; font-weight:700; color: var(--ink); }
.live-performer-teacher{ font-size:12.5px; color: var(--ink-soft); }
.live-note-card{
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px 18px; border: 1px solid var(--line); text-align:center;
  font-size:15px; color: var(--ink-soft);
}
.current-upcoming{ margin-top: 18px; }
.current-upcoming-title{
  font-size: 11.5px; font-weight:700; color: var(--ink-soft); letter-spacing:.08em;
  margin-bottom: 6px; padding-left: 2px;
}
.upcoming-row{
  display:flex; align-items:center; gap:10px; padding: 8px 4px;
  border-bottom: 1px solid var(--line);
}
.upcoming-row:last-child{ border-bottom: none; }
.upcoming-badge{
  width:26px; height:26px; border-radius:8px; flex-shrink:0;
  background: var(--blush-soft); color: var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700;
}
.upcoming-text{ min-width:0; flex:1; }
.upcoming-event{
  font-size:13px; font-weight:600; color: var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.upcoming-sub{ font-size:11.5px; color: var(--ink-soft); }
.upcoming-kind-tag{
  font-size: 10px; margin-left:6px;
}
.upcoming-time{ font-size:11.5px; font-weight:700; color: var(--ink-soft); flex-shrink:0; white-space:nowrap; }

@media (min-width: 480px){
  h1.title{ font-size: 30px; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <button id="themeToggleBtn" class="theme-toggle" aria-label="ダークモード切り替え"></button>
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>NAKAGAWA YUTA DANCE ACADEMY</span>
    </div>
    <h1 class="title heading-font">本日の<em>進行表</em></h1>
    <div class="clock-row">
      <div class="clock">現在時刻 <strong id="liveClock">--:--</strong></div>
      <div class="clock" id="phaseLabel">開始前</div>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="fav" id="tabBtnFav">お気に入り<span class="count" id="favCount">0</span></button>
  <button class="tab-btn" data-tab="current" id="tabBtnCurrent">現在進行中</button>
  <button class="tab-btn" data-tab="all" id="tabBtnAll">全体タイムテーブル</button>
</div>

<div id="nextUpBar" class="next-up-bar" style="display:none;"></div>
<div id="driftBanner" class="drift-banner" style="display:none;"></div>

<main>
  <section id="panelFav"></section>
  <section id="panelCurrent" style="display:none;"></section>
  <section id="panelAll" style="display:none;"></section>
</main>

<footer class="credit-wrap">
  <div class="credit-card">
    <div class="mark-row">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M20 6 L34 20 L20 34 L6 20 Z" stroke="var(--gold)" stroke-width="1.3"/>
        <path d="M20 6 L20 34 M6 20 L34 20" stroke="var(--gold)" stroke-width="1.3"/>
        <circle cx="20" cy="6" r="2.6" fill="#14151c" stroke="var(--gold)" stroke-width="1.4"/>
        <circle cx="20" cy="34" r="2.6" fill="#14151c" stroke="var(--gold)" stroke-width="1.4"/>
        <circle cx="6" cy="20" r="2.6" fill="#14151c" stroke="var(--teal)" stroke-width="1.4"/>
        <circle cx="34" cy="20" r="2.6" fill="#14151c" stroke="var(--teal)" stroke-width="1.4"/>
        <circle cx="20" cy="20" r="4.2" fill="#14151c" stroke="var(--gold)" stroke-width="1.4"/>
        <circle cx="20" cy="20" r="1.6" fill="var(--gold)"/>
      </svg>

<script>
(function () {
  "use strict";

  const KIND_LABEL = { mini: "ミニ", solo: "ソロ", mix: "ミックス", special: "特別" };
  const PHASE_NAME = { rehearsal: "リハーサル", show: "本番" };
  const EVENT_ID = SCHEDULE.eventId || "event";
  const FAV_KEY = "favorites_" + EVENT_ID;
  const DRIFT_KEY = "drift_" + EVENT_ID;
  const THEME_KEY = "theme_" + EVENT_ID;

  const items = SCHEDULE.items; // merged items with showStart/showEnd/rehearsalStart/rehearsalEnd (absolute minutes)
  const showSections = SCHEDULE.showSections;
  const rehearsalSections = SCHEDULE.rehearsalSections;
  const showStartMin = SCHEDULE.showStartMin;
  const showEndMin = SCHEDULE.showEndMin;
  const rehearsalStartMin = SCHEDULE.rehearsalStartMin;

  // group items by part for the timetable view
  const partList = showSections
    .filter((s) => s.type === "part_start")
    .map((s) => ({
      partIndex: s.partIndex,
      title: s.label,
      showStartAbs: s.startAbs,
      rehearsalStartAbs: (rehearsalSections.find((r) => r.type === "part_start" && r.partIndex === s.partIndex) || {}).startAbs,
      items: items.filter((it) => it.partIndex === s.partIndex),
    }));

  // ---------- time helpers ----------
  function fmtClock(minOfDay) {
    const h = Math.floor(minOfDay / 60) % 24;
    const m = Math.floor(minOfDay) % 60;
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  }
  function dateAtMinOfDay(minOfDay) {
    const d = new Date();
    d.setHours(Math.floor(minOfDay / 60), Math.floor(minOfDay) % 60, 0, 0);
    return d;
  }
  function phaseStatus(startAbs, endAbs, now) {
    const startDate = dateAtMinOfDay(startAbs);
    const endDate = dateAtMinOfDay(endAbs);
    if (now < startDate) {
      const minsLeft = Math.max(1, Math.ceil((startDate - now) / 60000));
      return { state: "wait", minsLeft, startDate, endDate };
    } else if (now >= startDate && now < endDate) {
      return { state: "now", minsLeft: 0, startDate, endDate };
    } else {
      return { state: "done", minsLeft: 0, startDate, endDate };
    }
  }

  // ---------- favorites storage ----------
  let favorites = new Set();
  try {
    const raw = localStorage.getItem(FAV_KEY);
    if (raw) favorites = new Set(JSON.parse(raw));
  } catch (e) {}
  function saveFavorites() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favorites)));
    } catch (e) {}
  }
  function favKey(item, name) {
    return item.partIndex + "-" + item.kind + "-" + item.no + "::" + name;
  }
  function itemKey(item) {
    return item.partIndex + "-" + item.kind + "-" + item.no;
  }
  const itemByKey = {};
  items.forEach((it) => { itemByKey[itemKey(it)] = it; });

  // ---------- drift correction (manual "running late/early" sync) ----------
  let drift = { phase: null, offsetMin: 0, label: "" };
  try {
    const raw = localStorage.getItem(DRIFT_KEY);
    if (raw) drift = JSON.parse(raw);
  } catch (e) {}
  function saveDrift() {
    try {
      localStorage.setItem(DRIFT_KEY, JSON.stringify(drift));
    } catch (e) {}
  }
  function adjusted(minAbs, phase) {
    return minAbs + (drift.phase === phase ? drift.offsetMin : 0);
  }
  // ---------- in-app confirm modal (works even when window.confirm is sandboxed) ----------
  function showConfirm(message) {
    return new Promise((resolve) => {
      const overlay = document.getElementById("confirmOverlay");
      const msgEl = document.getElementById("confirmMessage");
      const okBtn = document.getElementById("confirmOkBtn");
      const cancelBtn = document.getElementById("confirmCancelBtn");
      if (!overlay || !msgEl || !okBtn || !cancelBtn) {
        resolve(false);
        return;
      }
      msgEl.textContent = message;
      overlay.style.display = "flex";
      const cleanup = (result) => {
        overlay.style.display = "none";
        okBtn.removeEventListener("click", onOk);
        cancelBtn.removeEventListener("click", onCancel);
        overlay.removeEventListener("click", onOverlayClick);
        resolve(result);
      };
      const onOk = () => cleanup(true);
      const onCancel = () => cleanup(false);
      const onOverlayClick = (e) => {
        if (e.target === overlay) cleanup(false);
      };
      okBtn.addEventListener("click", onOk);
      cancelBtn.addEventListener("click", onCancel);
      overlay.addEventListener("click", onOverlayClick);
    });
  }

  function syncToItem(item) {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const distReh = item.rehearsalStart != null ? Math.abs(nowMin - item.rehearsalStart) : Infinity;
    const distShow = Math.abs(nowMin - item.showStart);
    const phase = distReh <= distShow ? "rehearsal" : "show";
    const scheduled = phase === "rehearsal" ? item.rehearsalStart : item.showStart;
    const offsetMin = Math.round(nowMin - scheduled);
    const part = partList.find((p) => p.partIndex === item.partIndex);
    const label = (part ? partShortTitle(part.title) : "") + "　" + item.no + "番";
    const sign = offsetMin >= 0 ? "+" : "";
    showConfirm(`${label}（${PHASE_NAME[phase]}）を基準に、${sign}${offsetMin}分補正します。\nよろしいですか？`).then((confirmed) => {
      if (!confirmed) return;
      drift = { phase, offsetMin, label };
      saveDrift();
      renderDriftBanner();
      refreshAllDisplays();
    });
  }
  function clearDrift() {
    drift = { phase: null, offsetMin: 0, label: "" };
    saveDrift();
    renderDriftBanner();
    refreshAllDisplays();
  }
  function renderDriftBanner() {
    const el = document.getElementById("driftBanner");
    if (!el) return;
    if (!drift.phase) {
      el.style.display = "none";
      el.innerHTML = "";
      return;
    }
    el.style.display = "flex";
    const sign = drift.offsetMin >= 0 ? "+" : "";
    el.innerHTML = `<span>⏱ ${esc(drift.label)}(${PHASE_NAME[drift.phase]})を基準に ${sign}${drift.offsetMin}分 補正中</span><button id="clearDriftBtn">解除</button>`;
    document.getElementById("clearDriftBtn").addEventListener("click", clearDrift);
  }
  function refreshAllDisplays() {
    updateLiveBlocks();
    if (activeTab === "all" && panelAll.dataset.built) {
      const input = document.getElementById("searchInput");
      const q = input ? input.value : "";
      renderTimetable();
      renderSearchResults(q);
    }
    if (activeTab === "current") renderCurrentPanel();
    renderNextUpBar();
  }

  // ---------- next-up bar (nearest favorite, always visible) ----------
  function renderNextUpBar() {
    const el = document.getElementById("nextUpBar");
    if (!el) return;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    let best = null;
    items.forEach((item) => {
      item.performers.forEach((p) => {
        const key = favKey(item, p.name);
        if (!favorites.has(key)) return;
        ["rehearsal", "show"].forEach((phase) => {
          const start = adjusted(item[phase + "Start"], phase);
          const end = adjusted(item[phase + "End"], phase);
          let cand = null;
          if (nowMin >= start && nowMin < end) {
            cand = { pri: 0, sortKey: 0, text: `✨ ${esc(p.name)}様が${PHASE_NAME[phase]}中です` };
          } else if (nowMin < start) {
            const mins = Math.max(1, Math.ceil(start - nowMin));
            cand = { pri: 1, sortKey: mins, text: `${esc(p.name)}様 ${PHASE_NAME[phase]}まであと${mins}分` };
          }
          if (cand && (!best || cand.pri < best.pri || (cand.pri === best.pri && cand.sortKey < best.sortKey))) {
            best = cand;
          }
        });
      });
    });
    if (!best) {
      el.style.display = "none";
      el.innerHTML = "";
      return;
    }
    el.style.display = "flex";
    el.innerHTML = `<span>${best.text}</span>`;
  }

  // ---------- DOM refs ----------
  const panelFav = document.getElementById("panelFav");
  const panelCurrent = document.getElementById("panelCurrent");
  const panelAll = document.getElementById("panelAll");
  const tabBtnFav = document.getElementById("tabBtnFav");
  const tabBtnCurrent = document.getElementById("tabBtnCurrent");
  const tabBtnAll = document.getElementById("tabBtnAll");
  const favCountEl = document.getElementById("favCount");
  const liveClockEl = document.getElementById("liveClock");
  const phaseLabelEl = document.getElementById("phaseLabel");

  let activeTab = "fav";
  const openParts = new Set();

  function setTab(tab) {
    activeTab = tab;
    tabBtnFav.classList.toggle("active", tab === "fav");
    tabBtnCurrent.classList.toggle("active", tab === "current");
    tabBtnAll.classList.toggle("active", tab === "all");
    panelFav.style.display = tab === "fav" ? "" : "none";
    panelCurrent.style.display = tab === "current" ? "" : "none";
    panelAll.style.display = tab === "all" ? "" : "none";
    if (tab === "fav") renderFavPanel();
    if (tab === "current") renderCurrentPanel();
    if (tab === "all" && !panelAll.dataset.built) renderAllPanel();
  }
  tabBtnFav.addEventListener("click", () => setTab("fav"));
  tabBtnCurrent.addEventListener("click", () => setTab("current"));
  tabBtnAll.addEventListener("click", () => setTab("all"));

  // ---------- current (LIVE) tab: purely time-driven, no manual sync needed ----------
  function buildDayTimeline() {
    const moments = [];
    items.forEach((item) => {
      if (item.rehearsalStart != null) {
        moments.push({
          start: adjusted(item.rehearsalStart, "rehearsal"),
          end: adjusted(item.rehearsalEnd, "rehearsal"),
          type: "item",
          item,
          phase: "rehearsal",
        });
      }
      moments.push({
        start: adjusted(item.showStart, "show"),
        end: adjusted(item.showEnd, "show"),
        type: "item",
        item,
        phase: "show",
      });
    });
    rehearsalSections.forEach((s) => {
      if (s.type === "part_start" || !("endAbs" in s)) return;
      moments.push({ start: adjusted(s.startAbs, "rehearsal"), end: adjusted(s.endAbs, "rehearsal"), type: "block", block: s, phase: "rehearsal" });
    });
    showSections.forEach((s) => {
      if (s.type === "part_start" || !("endAbs" in s)) return;
      moments.push({ start: adjusted(s.startAbs, "show"), end: adjusted(s.endAbs, "show"), type: "block", block: s, phase: "show" });
    });
    moments.sort((a, b) => a.start - b.start);
    return moments;
  }

  function momentLabel(m) {
    if (m.type === "block") {
      return { partLabel: "", no: "", event: m.block.label, perfSummary: "", kind: null };
    }
    const item = m.item;
    const part = partList.find((p) => p.partIndex === item.partIndex);
    const partLabel = part ? partShortTitle(part.title) : item.partIndex === -1 ? "スペシャル" : "";
    const first = item.performers[0];
    let firstStr = "";
    if (first) {
      firstStr = first.name + (item.partIndex === -1 ? "先生" : "様");
      if (first.teacher) firstStr += "（" + first.teacher + "先生）";
      else if (first.studio) firstStr += "（" + first.studio + "）";
    }
    const extra = item.performers.length - 1;
    const perfSummary = firstStr + (extra > 0 ? " 他" + extra + "名" : "");
    return { partLabel, no: item.no, event: item.event, perfSummary, kind: item.kind };
  }

  function renderCurrentPanel() {
    if (!panelCurrent) return;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const moments = buildDayTimeline();
    const currentIdx = moments.findIndex((m) => nowMin >= m.start && nowMin < m.end);
    const current = currentIdx >= 0 ? moments[currentIdx] : null;
    let upcoming;
    if (currentIdx >= 0) {
      upcoming = moments.slice(currentIdx + 1, currentIdx + 6);
    } else {
      const nextIdx = moments.findIndex((m) => m.start > nowMin);
      upcoming = nextIdx >= 0 ? moments.slice(nextIdx, nextIdx + 5) : [];
    }

    let liveHtml;
    if (!current) {
      liveHtml = `<div class="live-note-card">只今進行中の演目はありません</div>`;
    } else if (current.type === "block") {
      liveHtml = `
        <div class="live-card">
          <div class="live-eyebrow"><span class="live-dot"></span>LIVE NOW</div>
          <div class="live-order">${esc(current.block.label)}</div>
        </div>`;
    } else {
      const item = current.item;
      const part = partList.find((p) => p.partIndex === item.partIndex);
      const partLabel = part ? partShortTitle(part.title) : item.partIndex === -1 ? "スペシャル ショータイム" : "";
      const perfHtml = item.performers
        .map((p) => {
          let sub = "";
          if (p.teacher) sub = `<div class="live-performer-teacher">${esc(p.teacher)}先生${p.studio ? "（" + esc(p.studio) + "）" : ""}</div>`;
          else if (p.studio) sub = `<div class="live-performer-teacher">${esc(p.studio)}</div>`;
          return `<div><div class="live-performer-name">${performerName(p.name, item)}</div>${sub}</div>`;
        })
        .join("");
      liveHtml = `
        <div class="live-card">
          <div class="live-eyebrow"><span class="live-dot"></span>LIVE NOW</div>
          <div class="live-order">${esc(partLabel)}　${item.no}番</div>
          <div class="live-event">${esc(item.event)}（${current.phase === "rehearsal" ? "リハーサル" : "本番"}）<span class="kind-badge ${item.kind}" style="margin-left:6px;">${KIND_LABEL[item.kind]}</span></div>
          <div class="live-performers">${perfHtml}</div>
        </div>`;
    }

    let upcomingHtml = "";
    if (upcoming.length > 0) {
      const rows = upcoming
        .map((m, i) => {
          const { partLabel, no, event, perfSummary, kind } = momentLabel(m);
          const opacity = (0.95 - i * 0.08).toFixed(2);
          const phaseTag = m.phase === "rehearsal" ? "リハ" : "本番";
          const badgeText = no !== "" ? String(no) : "・";
          const kindTag = kind ? `<span class="kind-badge ${kind} upcoming-kind-tag">${KIND_LABEL[kind]}</span>` : "";
          return `
          <div class="upcoming-row" style="opacity:${opacity}">
            <div class="upcoming-badge">${esc(badgeText)}</div>
            <div class="upcoming-text">
              <div class="upcoming-event">${partLabel ? esc(partLabel) + "　" : ""}${esc(event)}${kindTag}</div>
              ${perfSummary ? `<div class="upcoming-sub">${esc(perfSummary)}</div>` : ""}
            </div>
            <div class="upcoming-time">${phaseTag} ${fmtClock(m.start)}</div>
          </div>`;
        })
        .join("");
      upcomingHtml = `
        <div class="current-upcoming">
          <div class="current-upcoming-title">このあと</div>
          ${rows}
        </div>`;
    }

    panelCurrent.innerHTML = liveHtml + upcomingHtml;
  }

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function studentName(name) {
    return esc(name) + '<span class="honorific">様</span>';
  }
  function performerName(name, item) {
    const honorific = item && item.partIndex === -1 ? "先生" : "様";
    return esc(name) + '<span class="honorific">' + honorific + "</span>";
  }

  // ---------- shared markup builders ----------
  function itemHeaderHtml(item, partTitleShort) {
    const showTime = adjusted(item.showStart, "show");
    const rehChip = item.rehearsalStart != null ? `<span class="time-chip reh">リハ ${fmtClock(adjusted(item.rehearsalStart, "rehearsal"))}</span>` : `<span class="time-chip reh">リハなし</span>`;
    return `
      <div class="item-no-badge">${item.no}</div>
      <div class="item-headinfo">
        <div class="item-times">
          ${rehChip}
          <span class="time-chip show">本番 ${fmtClock(showTime)}</span>
          <span class="kind-badge ${item.kind}">${KIND_LABEL[item.kind]}</span>
          <button class="sync-btn" data-sync-key="${esc(itemKey(item))}" title="今ここを基準に時刻を補正">📍今ここ</button>
        </div>
        <div class="item-event">${esc(item.event)}${partTitleShort ? " ／ " + esc(partTitleShort) : ""}</div>
      </div>`;
  }
  function performerRowHtml(item, p) {
    const key = favKey(item, p.name);
    const active = favorites.has(key);
    let subLine = "";
    if (p.teacher) {
      subLine = `<div class="performer-teacher">${esc(p.teacher)}先生${p.studio ? "（" + esc(p.studio) + "）" : ""}</div>`;
    } else if (p.studio) {
      subLine = `<div class="performer-teacher">${esc(p.studio)}</div>`;
    }
    return `
      <div class="performer-row">
        <div class="performer-info">
          <div class="performer-name">${performerName(p.name, item)}</div>
          ${subLine}
        </div>
        <button class="star-btn ${active ? "active" : ""}" data-key="${esc(key)}">${active ? "★" : "☆"}</button>
      </div>`;
  }
  function partShortTitle(title) {
    return title.split("〜")[0].trim();
  }

  // ---------- favorites panel ----------
  function renderFavPanel() {
    const favItems = [];
    items.forEach((item) => {
      item.performers.forEach((p) => {
        const key = favKey(item, p.name);
        if (favorites.has(key)) favItems.push({ item, name: p.name, teacher: p.teacher, studio: p.studio, key });
      });
    });
    favItems.sort((a, b) => a.item.showStart - b.item.showStart);
    favCountEl.textContent = favItems.length;

    if (favItems.length === 0) {
      panelFav.innerHTML = `
        <div class="empty-state">
          <p>まだお気に入りが登録されていません。</p>
          <p>★マークを付けてください。</p>
          <button id="gotoAllBtn">全体タイムテーブルを見る</button>
        </div>`;
      document.getElementById("gotoAllBtn").addEventListener("click", () => setTab("all"));
      return;
    }

    panelFav.innerHTML = favItems
      .map((f) => {
        const part = partList.find((pt) => pt.partIndex === f.item.partIndex);
        const partLabel = part ? partShortTitle(part.title) : f.item.partIndex === -1 ? "スペシャル" : "";
        const subMeta = f.teacher
          ? " ・ " + esc(f.teacher) + "先生" + (f.studio ? "（" + esc(f.studio) + "）" : "")
          : f.studio
          ? " ・ " + esc(f.studio)
          : "";
        const rehBlock =
          f.item.rehearsalStart != null
            ? `<div class="fav-phase-block" data-phase="rehearsal" data-start="${adjusted(f.item.rehearsalStart, "rehearsal")}" data-end="${adjusted(f.item.rehearsalEnd, "rehearsal")}">
            <div class="phase-label">リハーサル</div>
            <div class="phase-body"></div>
          </div>`
            : "";
        return `
        <div class="fav-card" data-key-ref="${esc(f.key)}" data-live>
          <div class="fav-top">
            <div class="fav-info">
              <div class="fav-order-label">${esc(partLabel)}　${f.item.no}番</div>
              <div class="fav-name">${performerName(f.name, f.item)}</div>
              <div class="fav-meta">${esc(f.item.event)}${subMeta}</div>
            </div>
            <button class="fav-star-btn" data-key="${esc(f.key)}" title="お気に入り解除">★</button>
          </div>
          ${rehBlock}
          <div class="fav-phase-block" data-phase="show" data-start="${adjusted(f.item.showStart, "show")}" data-end="${adjusted(f.item.showEnd, "show")}">
            <div class="phase-label">本番</div>
            <div class="phase-body"></div>
          </div>
        </div>`;
      })
      .join("");

    panelFav.querySelectorAll(".fav-star-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        favorites.delete(btn.dataset.key);
        saveFavorites();
        renderFavPanel();
        updateAllTabStars();
        renderNextUpBar();
      });
    });

    updateLiveBlocks();
  }

  function updateLiveBlocks() {
    const now = new Date();
    document.querySelectorAll(".fav-phase-block").forEach((block) => {
      const startAbs = Number(block.dataset.start);
      const endAbs = Number(block.dataset.end);
      const st = phaseStatus(startAbs, endAbs, now);
      const body = block.querySelector(".phase-body");
      block.classList.toggle("is-now", st.state === "now");
      block.classList.toggle("is-done", st.state === "done");
      block.classList.toggle("compact", st.state === "done");
      if (st.state === "wait") {
        body.innerHTML = `<span class="num">${st.minsLeft}</span><span class="unit">分後</span><span class="clocktime">（${fmtClock(startAbs)}ごろ）</span>`;
      } else if (st.state === "now") {
        body.innerHTML = `<span class="badge now">✨ 只今の時間帯です</span>`;
      } else {
        const name = PHASE_NAME[block.dataset.phase] || "";
        body.innerHTML = `<span class="badge-compact">✓ ${name}終了（${fmtClock(startAbs)}）</span>`;
      }
    });
    updateHeaderPhase(now);
  }

  // ---------- all tab: overview + search + timetable ----------
  function renderAllPanel() {
    panelAll.dataset.built = "1";
    const chips = partList
      .map(
        (p) => `<div class="overview-chip" data-jump="part-${p.partIndex}">
            <div class="label">${esc(partShortTitle(p.title))}</div>
            <div class="t">本番 ${fmtClock(adjusted(p.showStartAbs, "show"))}〜</div>
            <div class="t2">リハ ${fmtClock(adjusted(p.rehearsalStartAbs, "rehearsal"))}〜</div>
          </div>`
      )
      .join("");
    const proshow = showSections.find((s) => s.type === "proshow" && s.label.includes("ショー"));
    const proRehearsalChip = rehearsalSections.find((s) => s.type === "pro_rehearsal");

    panelAll.innerHTML = `
      <div class="overview-scroll">
        <div class="overview-chip" data-jump="pro-rehearsal-jump"><div class="label">プロリハ</div><div class="t2">${fmtClock(proRehearsalChip.startAbs)}〜</div></div>
        ${chips}
        ${proshow ? `<div class="overview-chip" data-jump="proshow-jump"><div class="label">${esc(proshow.label)}</div><div class="t">本番 ${fmtClock(proshow.startAbs)}〜</div></div>` : ""}
      </div>
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="お名前で検索（生徒様・先生どちらでも）" autocomplete="off">
      </div>
      <div class="search-results" id="searchResults"></div>
      <div id="timetableList"></div>
    `;

    document.querySelectorAll(".overview-chip[data-jump]").forEach((chip) => {
      chip.addEventListener("click", () => {
        const jumpId = chip.dataset.jump;
        if (jumpId.startsWith("part-")) {
          openParts.add(Number(jumpId.split("-")[1]));
          renderTimetable();
        }
        const target = document.getElementById(jumpId);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("input", () => renderSearchResults(searchInput.value.trim()));

    renderTimetable();
    renderSearchResults("");
  }

  function renderSearchResults(query) {
    const box = document.getElementById("searchResults");
    if (!query) {
      box.innerHTML = "";
      return;
    }
    const matches = [];
    items.forEach((item) => {
      item.performers.forEach((p) => {
        if (p.name.includes(query) || (p.teacher && p.teacher.includes(query))) matches.push({ item, p });
      });
    });
    if (matches.length === 0) {
      box.innerHTML = `<div class="search-hint">「${esc(query)}」に一致する方が見つかりません</div>`;
      return;
    }
    box.innerHTML =
      `<div class="search-hint">${matches.length}件ヒット</div>` +
      matches
        .map(({ item, p }) => {
          const part = partList.find((pt) => pt.partIndex === item.partIndex);
          const partLabel = part ? partShortTitle(part.title) : item.partIndex === -1 ? "スペシャル" : "";
          return `
          <div class="item-row search-item-row">
            <div class="item-row-flex">
              ${itemHeaderHtml(item, partLabel)}
            </div>
            ${performerRowHtml(item, p)}
          </div>`;
        })
        .join("");
    box.querySelectorAll(".star-btn").forEach((btn) => btn.addEventListener("click", () => onStarClick(btn)));
    box.querySelectorAll(".sync-btn").forEach((btn) => btn.addEventListener("click", () => onSyncClick(btn)));
  }

  function renderTimetable() {
    const list = document.getElementById("timetableList");
    if (!list) return;

    const html = [];
    const preShowBlocks = rehearsalSections.filter((s) => s.type !== "part_start");
    preShowBlocks.forEach((s, i) => {
      const anchorId = i === 0 ? ` id="pro-rehearsal-jump"` : "";
      html.push(
        `<div class="break-row"${anchorId}><span>${esc(s.label)}（リハ）</span><span>${fmtClock(s.startAbs)}〜${fmtClock(s.endAbs)}</span></div>`
      );
    });
    let proshowCount = 0;
    showSections.forEach((s) => {
      if (s.type === "break") {
        html.push(`<div class="break-row"><span>${esc(s.label)}</span><span>${fmtClock(s.startAbs)}〜${fmtClock(s.endAbs)}</span></div>`);
        return;
      }
      if (s.type === "formation") {
        html.push(`<div class="break-row"><span>${esc(s.label)}</span><span>${fmtClock(s.startAbs)}〜${fmtClock(s.endAbs)}</span></div>`);
        return;
      }
      if (s.type === "proshow") {
        const specialItems = items.filter((it) => it.partIndex === -1);
        if (s.label.includes("ショー") && specialItems.length > 0) {
          const open = openParts.has(-1);
          const itemsHtml = specialItems
            .map((item) => {
              const perfHtml = item.performers.map((p) => performerRowHtml(item, p)).join("");
              return `
              <div class="item-row">
                <div class="item-row-flex">${itemHeaderHtml(item, "")}</div>
                ${perfHtml}
              </div>`;
            })
            .join("");
          html.push(`
            <div class="part-section">
              <div class="part-header ${open ? "open" : ""}" id="part--1" data-part="-1">
                <div class="htitle">${esc(s.label)}
                  <small>本番 ${fmtClock(adjusted(s.startAbs, "show"))}〜／リハ(プロリハ起点) ${fmtClock(adjusted(specialItems[0].rehearsalStart, "rehearsal"))}〜</small>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="part-body ${open ? "open" : ""}">${itemsHtml}</div>
            </div>`);
          return;
        }
        proshowCount += 1;
        const anchorId = proshowCount === 1 ? ` id="proshow-jump"` : "";
        html.push(`<div class="proshow-row"${anchorId}>${esc(s.label)}<small>${fmtClock(s.startAbs)}〜${fmtClock(s.endAbs)}（出演者一覧は別紙をご覧ください）</small></div>`);
        return;
      }
      if (s.type === "part_start") {
        const part = partList.find((p) => p.partIndex === s.partIndex);
        const open = openParts.has(s.partIndex);
        const itemsHtml = part.items
          .map((item) => {
            const perfHtml = item.performers.map((p) => performerRowHtml(item, p)).join("");
            return `
            <div class="item-row">
              <div class="item-row-flex">${itemHeaderHtml(item, "")}</div>
              ${perfHtml}
            </div>`;
          })
          .join("");
        const subtitle = s.label.includes("〜") ? `〜${esc(s.label.split("〜")[1] || "")}〜　` : "";
        html.push(`
          <div class="part-section">
            <div class="part-header ${open ? "open" : ""}" id="part-${s.partIndex}" data-part="${s.partIndex}">
              <div class="htitle">${esc(partShortTitle(s.label))}
                <small>${subtitle}本番 ${fmtClock(adjusted(part.showStartAbs, "show"))}〜／リハ ${fmtClock(adjusted(part.rehearsalStartAbs, "rehearsal"))}〜</small>
              </div>
              <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="part-body ${open ? "open" : ""}">${itemsHtml}</div>
          </div>`);
      }
    });

    list.innerHTML = html.join("");

    list.querySelectorAll(".part-header").forEach((h) => {
      h.addEventListener("click", () => {
        const p = Number(h.dataset.part);
        if (openParts.has(p)) openParts.delete(p);
        else openParts.add(p);
        renderTimetable();
      });
    });
    list.querySelectorAll(".star-btn").forEach((btn) => btn.addEventListener("click", () => onStarClick(btn)));
    list.querySelectorAll(".sync-btn").forEach((btn) => btn.addEventListener("click", () => onSyncClick(btn)));
  }

  function onStarClick(btn) {
    const key = btn.dataset.key;
    if (favorites.has(key)) favorites.delete(key);
    else favorites.add(key);
    saveFavorites();
    updateAllTabStars();
    favCountEl.textContent = countFavorites();
    if (activeTab === "fav") renderFavPanel();
    renderNextUpBar();
  }

  function onSyncClick(btn) {
    const item = itemByKey[btn.dataset.syncKey];
    if (item) syncToItem(item);
  }

  function countFavorites() {
    let n = 0;
    items.forEach((item) => item.performers.forEach((p) => { if (favorites.has(favKey(item, p.name))) n++; }));
    return n;
  }

  function updateAllTabStars() {
    document.querySelectorAll(".star-btn[data-key]").forEach((btn) => {
      const active = favorites.has(btn.dataset.key);
      btn.classList.toggle("active", active);
      btn.textContent = active ? "★" : "☆";
    });
  }

  // ---------- header live clock / phase ----------
  function updateHeaderPhase(now) {
    const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    let label = "開始前";
    if (nowMin >= rehearsalStartMin && nowMin < showStartMin) label = "リハーサル中";
    else if (nowMin >= showStartMin && nowMin < showEndMin) label = "本番 開催中";
    else if (nowMin >= showEndMin) label = "終了";
    phaseLabelEl.textContent = label;
  }

  function tickClock() {
    const now = new Date();
    liveClockEl.textContent =
      String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0") + ":" + String(now.getSeconds()).padStart(2, "0");
    updateHeaderPhase(now);
  }

  // ---------- dark mode toggle ----------
  const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  const themeToggleBtn = document.getElementById("themeToggleBtn");
  let theme = "light";
  try {
    theme = localStorage.getItem(THEME_KEY) || "light";
  } catch (e) {}
  function applyTheme() {
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      if (themeToggleBtn) themeToggleBtn.innerHTML = SUN_ICON;
    } else {
      document.documentElement.removeAttribute("data-theme");
      if (themeToggleBtn) themeToggleBtn.innerHTML = MOON_ICON;
    }
  }
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (e) {}
      applyTheme();
    });
  }
  applyTheme();

  // ---------- back to top ----------
  const backToTopBtn = document.getElementById("backToTopBtn");
  if (backToTopBtn) {
    window.addEventListener(
      "scroll",
      () => {
        backToTopBtn.classList.toggle("visible", window.scrollY > 400);
      },
      { passive: true }
    );
    backToTopBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  // ---------- init ----------
  favCountEl.textContent = countFavorites();
  renderFavPanel();
  renderDriftBanner();
  renderNextUpBar();
  tickClock();
  setInterval(tickClock, 1000);
  setInterval(() => {
    updateLiveBlocks();
    renderNextUpBar();
    if (activeTab === "current") renderCurrentPanel();
  }, 15000);

  // ---------- PWA: service worker registration ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();

</script>
</body>
</html>
