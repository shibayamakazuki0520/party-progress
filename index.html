<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>選手会パーティー - 進行状況</title>
<style>
  :root {
    --bg: #faf6ef;
    --panel: #ffffff;
    --panel2: #f3ece0;
    --border: #e6dcc8;
    --text: #2b2620;
    --text-dim: #7a6f5c;
    --text-dim2: #a89d86;
    --ink: #2b2620;
    --accent: #b8863b;
    --on-accent: #ffffff;
    --current-bg: #f4e6c8;
    --red: #b3403a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Sans', 'Yu Gothic', system-ui, -apple-system, sans-serif;
    padding-bottom: 24px;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d8cdb4; border-radius: 4px; }
  input:focus-visible, textarea:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

  header {
    padding: 20px 18px 14px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0; color: var(--ink); }
  .subtitle { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

  .mode-toggle { display: flex; gap: 6px; background: var(--ink); padding: 4px; border-radius: 10px; }
  .mode-btn {
    display: flex; align-items: center; border: none; background: transparent;
    color: #cfc3a8; font-size: 12px; font-weight: 600; padding: 7px 10px;
    border-radius: 7px; cursor: pointer;
  }
  .mode-btn.active { background: var(--accent); color: var(--on-accent); }
  .viewer-only-tag { display: flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-dim); padding: 7px 10px; }

  .setup-notice {
    margin-top: 12px; font-size: 11px; line-height: 1.6; color: #7a3b1a;
    background: #fbe9d5; border: 1px solid #eec89a; border-radius: 8px; padding: 8px 10px;
  }

  .progress-track { margin-top: 14px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .4s ease; }
  .progress-label { margin-top: 6px; font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }

  .now-card {
    margin: 16px 16px 0; background: var(--panel); border-radius: 14px; border-left: 6px solid var(--accent);
    padding: 16px 18px; box-shadow: 0 6px 18px rgba(80,60,20,.06);
  }
  .now-label { font-size: 10px; letter-spacing: .2em; color: var(--accent); font-weight: 800; margin-bottom: 8px; }
  .now-special { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .now-name { font-size: 22px; font-weight: 800; letter-spacing: .01em; color: var(--ink); }
  .now-sub { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
  .now-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .meta-chip { display: flex; align-items: center; gap: 5px; font-size: 12px; background: var(--panel2); color: var(--text-dim); padding: 5px 10px; border-radius: 20px; }

  .next-strip { margin: 10px 16px 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); padding: 8px 14px; background: var(--panel2); border-radius: 10px; }
  .next-label { font-weight: 800; color: var(--text-dim2); letter-spacing: .1em; font-size: 10px; }
  .next-text { color: var(--text); }

  .controls { display: flex; gap: 8px; margin: 14px 16px 0; }
  .ctrl-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 14px; font-weight: 700; padding: 12px 10px; border-radius: 10px; cursor: pointer;
  }
  .ctrl-btn:disabled { opacity: .4; cursor: default; }
  .ctrl-primary { background: var(--accent); color: var(--on-accent); border: none; }
  .ctrl-ghost { flex: 0 0 auto; padding: 12px 14px; color: var(--text-dim); }

  .list-wrap { margin: 16px 12px 0; max-height: 52vh; overflow-y: auto; border-radius: 12px; background: var(--panel2); }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; cursor: default; }
  .row.clickable { cursor: pointer; }
  .row.current { background: var(--current-bg); }
  .row.done { opacity: .5; }
  .row-no { width: 22px; font-size: 11px; color: var(--text-dim2); font-weight: 700; flex-shrink: 0; }
  .row-time { width: 44px; font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
  .row-body { flex: 1; color: var(--text); line-height: 1.35; }
  .row-body strong { color: var(--ink); }
  .row-special { color: var(--text-dim); font-style: italic; }
  .row-note-preview { font-size: 11px; color: var(--accent); margin-top: 2px; font-weight: 600; }
  .row-status { flex-shrink: 0; text-align: right; }
  .badge-now { font-size: 10px; font-weight: 800; background: var(--accent); color: var(--on-accent); padding: 3px 8px; border-radius: 12px; }
  .badge-done { font-size: 10px; color: var(--text-dim2); }
  .expand-btn { display: block; margin-top: 4px; font-size: 10px; color: var(--text-dim2); background: transparent; border: none; padding: 0; cursor: pointer; }

  .note-panel { padding: 10px 12px 14px 46px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .note-panel-label { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; font-weight: 700; }
  .note-check-row { display: flex; gap: 18px; }
  .note-check { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--text); cursor: pointer; }
  .note-check input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }

  footer { text-align: center; font-size: 11px; color: var(--text-dim2); margin-top: 14px; }
  footer .err { color: var(--red); font-weight: 700; }

  .nexus-credit { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .nexus-word { font-size: 10px; letter-spacing: .1em; font-weight: 700; color: var(--ink); }
  .nexus-tagline { display: block; font-size: 9px; letter-spacing: .03em; color: var(--text-dim2); margin-top: 1px; }

  .pin-overlay { position: fixed; inset: 0; background: rgba(43,38,32,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .pin-card { width: 100%; max-width: 280px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: 0 12px 32px rgba(43,38,32,.25); }
  .pin-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .pin-input { width: 100%; font-size: 20px; letter-spacing: .3em; text-align: center; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
  .pin-error { font-size: 11px; color: var(--red); margin-top: 6px; }
  .pin-btn-row { display: flex; gap: 8px; margin-top: 14px; }

  .icon { display: inline-block; vertical-align: -2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ 設定 ============ */
const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxyuY6OH86TUAKIO3JhFjrLcodAQDVUjrziu-moOzDIEBGdUGN56OzlNDoWHDe1u4Ux/exec";
const STAFF_PIN = "2929"; // 運営モードの合言葉。必要に応じて変更してください
const POLL_MS = 4000;

/* ============ 項目ごとのオプション欄 ON/OFF ============ */
// このパーティーで写真・DVD注文の管理が必要かどうかをここで切り替える。
// 両方無いパーティーなら両方 false にすれば、行の展開ボタンごと出なくなる。
const OPTIONS_ENABLED = { photo: true, dvd: true };

/* ============ データ(進行表) ============ */
// convert_entry_order.py で出演順Excelから変換して、この RAW をまるごと差し替えてください。
// kind: "performance"(出演あり) | "special"(部の区切り・セクション見出し・挨拶や休憩など)
// performance行: [no, time, kind, title, performersStr]
//   title = 種目(曲名・演目名) / performersStr = "出演者・先生（教室名）" を「、」区切りで並べた文字列
// special行:      [no, time, kind, title, ""]
//   title = 部タイトルやセクション見出し、挨拶・休憩などの項目名
const RAW = [
  [1, "", "special", "開会挨拶", ""],
  [2, "", "performance", "オープニングダンス", "田中 花子・柴山 和樹"],
  [3, "", "performance", "ワルツ", "鈴木 一郎・佐藤 恵美"],
  [4, "", "performance", "ソロパフォーマンス", "山田 太郎"],
  [5, "", "special", "休憩", ""],
  [6, "", "performance", "タンゴ", "高橋 太郎・高橋 花子"],
  [7, "", "special", "表彰式", ""],
  [8, "", "special", "閉会挨拶", ""],
];
const FIELDS = ["no","time","kind","title","performersStr"];
const ITEMS = RAW.map(row => Object.fromEntries(FIELDS.map((f,i) => [f, row[i]])));
const isSpecial = kind => kind === "special";
const hasNotes = item => item.kind === "performance" && (OPTIONS_ENABLED.photo || OPTIONS_ENABLED.dvd);
const performersOf = item => (item.performersStr || "").split("、").map(s => s.trim()).filter(Boolean);

/* ============ ネットワーク ============ */
async function fetchSharedState() {
  const res = await fetch(GAS_ENDPOINT, { method: "GET" });
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  return await res.json();
}
async function pushSharedState(state) {
  const url = `${GAS_ENDPOINT}?data=${encodeURIComponent(JSON.stringify(state))}`;
  await fetch(url, { method: "GET", mode: "no-cors" });
}

/* ============ 状態 ============ */
const state = {
  mode: "viewer",
  unlocked: false,
  showPinPrompt: false,
  pinValue: "",
  pinError: false,
  currentIdx: 0,
  updatedAt: null,
  notes: {}, // { [no]: { photo: true/false, dvd: true/false } } スタッフのみ閲覧・編集可能
  loaded: false,
  saveError: false,
  loadError: false,
  expandedRows: new Set(),
  pendingRender: false,
  viewerOnlyLink: (() => {
    try { return new URLSearchParams(location.search).get("mode") === "viewer"; }
    catch (e) { return false; }
  })(),
};

function icon(name, size) {
  size = size || 13;
  const paths = {
    clock: `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,
    eye: `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`,
    radio: `<circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-8.49a6 6 0 0 0 0 8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>`,
    chevleft: `<polyline points="15 18 9 12 15 6"/>`,
    chevright: `<polyline points="9 18 15 12 9 6"/>`,
    reset: `<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>`,
  };
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths[name] || ""}</svg>`;
}

/* ============ 通信ロジック ============ */
let lastLocalWriteAt = 0;
const WRITE_GRACE_MS = 6000; // 自分の書き込み直後は、追いついていないpollの結果を無視する

function isUserEditing() {
  // 写真・DVDはチェックボックスになったため、入力中に再描画で消えるテキスト欄は無い
  return false;
}

async function fetchState() {
  try {
    const parsed = await fetchSharedState();

    if (Date.now() - lastLocalWriteAt < WRITE_GRACE_MS) {
      state.loaded = true;
      return;
    }

    const nextIdx = parsed.currentIdx ?? 0;
    const nextUpdatedAt = parsed.updatedAt ?? null;
    const nextNotes = parsed.notes ?? {};
    const changed =
      nextIdx !== state.currentIdx ||
      nextUpdatedAt !== state.updatedAt ||
      JSON.stringify(nextNotes) !== JSON.stringify(state.notes);
    const hadError = state.loadError;

    state.currentIdx = nextIdx;
    state.updatedAt = nextUpdatedAt;
    state.notes = nextNotes;
    state.loadError = false;

    const wasFirstLoad = !state.loaded;
    state.loaded = true;

    if (!changed && !hadError && !wasFirstLoad) return;
    if (isUserEditing()) { state.pendingRender = true; return; }
    render();
  } catch (e) {
    console.error("読み込みに失敗しました", e);
    state.loadError = true;
    state.loaded = true;
    if (isUserEditing()) { state.pendingRender = true; return; }
    render();
  }
}

async function pushState(idx) {
  const ts = new Date().toISOString();
  state.currentIdx = idx;
  state.updatedAt = ts;
  lastLocalWriteAt = Date.now();
  render();
  const hadError = state.saveError;
  try {
    await pushSharedState({ currentIdx: idx, updatedAt: ts, notes: state.notes });
    state.saveError = false;
  } catch (e) {
    console.error("保存に失敗しました", e);
    state.saveError = true;
  }
  if (state.saveError !== hadError) render();
}

async function pushNotes(nextNotes) {
  // 進行位置(currentIdx)には一切触れず、メモだけを更新する
  const ts = new Date().toISOString();
  state.notes = nextNotes;
  state.updatedAt = ts;
  lastLocalWriteAt = Date.now();
  const hadError = state.saveError;
  try {
    await pushSharedState({ currentIdx: state.currentIdx, updatedAt: ts, notes: nextNotes });
    state.saveError = false;
  } catch (e) {
    console.error("保存に失敗しました", e);
    state.saveError = true;
  }
  if (state.saveError !== hadError) render();
}

function toggleNote(no, field) {
  const cur = state.notes[String(no)] || { photo: false, dvd: false };
  const nextNotes = { ...state.notes, [String(no)]: { ...cur, [field]: !cur[field] } };
  state.notes = nextNotes; // 即座に画面へ反映してから保存する(チェック後の反応を待たせない)
  render();
  pushNotes(nextNotes);
}

function goNext() { if (state.currentIdx < ITEMS.length - 1) pushState(state.currentIdx + 1); }
function goPrev() { if (state.currentIdx > 0) pushState(state.currentIdx - 1); }
function resetAll() { pushState(0); }
function toggleRow(no) {
  if (state.expandedRows.has(no)) state.expandedRows.delete(no); else state.expandedRows.add(no);
  render();
}
function requestStaffMode() {
  if (state.unlocked) { state.mode = "staff"; render(); return; }
  state.pinValue = ""; state.pinError = false; state.showPinPrompt = true; render();
}
function submitPin() {
  if (state.pinValue === STAFF_PIN) { state.unlocked = true; state.showPinPrompt = false; state.mode = "staff"; }
  else { state.pinError = true; }
  render();
}
function lockStaffMode() { state.unlocked = false; state.mode = "viewer"; render(); }
function setViewerMode() { state.mode = "viewer"; render(); }
function onPinChange(v) { state.pinValue = v; state.pinError = false; }
function onFieldBlur() {
  if (state.pendingRender) {
    state.pendingRender = false;
    render();
  }
}

/* ============ 描画 ============ */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function renderNowCard(current) {
  let body;
  if (isSpecial(current.kind)) {
    body = `<div class="now-special">${esc(current.title)}</div>`;
  } else {
    const performers = performersOf(current);
    body = `
      <div class="now-name">${esc(current.title)}</div>
      ${performers.length ? `<div class="now-sub">${performers.map(esc).join("<br>")}</div>` : ""}
      ${current.time ? `<div class="now-meta"><span class="meta-chip">${icon("clock")} ${esc(current.time)}</span></div>` : ""}`;
  }
  return `<section class="now-card"><div class="now-label">NOW</div>${body}</section>`;
}

function render() {
  const current = ITEMS[state.currentIdx];
  const next = ITEMS[state.currentIdx + 1];
  const progressPct = Math.round(((state.currentIdx + 1) / ITEMS.length) * 100);

  let modeToggleHtml;
  if (state.viewerOnlyLink) {
    modeToggleHtml = `<span class="viewer-only-tag">${icon("eye")} 観覧用</span>`;
  } else {
    modeToggleHtml = `
      <button class="mode-btn ${state.mode === "viewer" ? "active" : ""}" onclick="setViewerMode()">${icon("eye")} 観覧</button>
      <button class="mode-btn ${state.mode === "staff" ? "active" : ""}" onclick="${state.mode === "staff" ? "lockStaffMode()" : "requestStaffMode()"}">${icon("radio")} 運営${state.mode === "staff" ? "中" : ""}</button>`;
  }

  const pinHtml = state.showPinPrompt ? `
    <div class="pin-overlay">
      <div class="pin-card">
        <div class="pin-title">運営モードの合言葉</div>
        <input class="pin-input" type="password" inputmode="numeric" autofocus value="${esc(state.pinValue)}"
          oninput="onPinChange(this.value)" onkeydown="if(event.key==='Enter') submitPin()" onblur="onFieldBlur()" placeholder="••••" />
        ${state.pinError ? `<div class="pin-error">合言葉が違います</div>` : ""}
        <div class="pin-btn-row">
          <button class="ctrl-btn ctrl-ghost" onclick="state.showPinPrompt=false; render();">キャンセル</button>
          <button class="ctrl-btn ctrl-primary" onclick="submitPin()">入る</button>
        </div>
      </div>
    </div>` : "";

  const controlsHtml = state.mode === "staff" ? `
    <div class="controls">
      <button class="ctrl-btn" ${state.currentIdx === 0 ? "disabled" : ""} onclick="goPrev()">${icon("chevleft",18)} 戻す</button>
      <button class="ctrl-btn ctrl-ghost" onclick="resetAll()">${icon("reset",16)} 最初へ</button>
      <button class="ctrl-btn ctrl-primary" ${state.currentIdx === ITEMS.length - 1 ? "disabled" : ""} onclick="goNext()">進める ${icon("chevright",18)}</button>
    </div>` : "";

  const nextHtml = next ? `
    <div class="next-strip">
      <span class="next-label">NEXT</span>
      <span class="next-text">${next.time ? `${esc(next.time)}　` : ""}${esc(next.title)}${performersOf(next).length ? `　${performersOf(next).join("、")}` : ""}</span>
    </div>` : "";

  const rowsHtml = ITEMS.map((item, idx) => {
    const rstate = idx < state.currentIdx ? "done" : idx === state.currentIdx ? "current" : "upcoming";
    const isExpanded = state.expandedRows.has(item.no);
    const note = state.notes[String(item.no)] || { photo: false, dvd: false };
    const rowClasses = ["row", "clickable", rstate === "current" ? "current" : "", rstate === "done" ? "done" : ""].filter(Boolean).join(" ");

    let bodyHtml;
    if (isSpecial(item.kind)) {
      bodyHtml = `<span class="row-special">${esc(item.title)}</span>`;
    } else {
      const performers = performersOf(item);
      bodyHtml = `<span><strong>${esc(item.title)}</strong>${performers.length ? `　${esc(performers.join("、"))}` : ""}</span>`;
    }
    // メモ(写真・DVD)は運営モードのときだけプレビューを出す。観覧側には一切出さない。
    const previewParts = [];
    if (state.mode === "staff") {
      if (OPTIONS_ENABLED.photo && note.photo) previewParts.push("写真あり");
      if (OPTIONS_ENABLED.dvd && note.dvd) previewParts.push("DVDあり");
    }
    const notePreview = previewParts.length ? `<div class="row-note-preview">${previewParts.join("　")}</div>` : "";

    const statusHtml = `
      ${rstate === "current" ? `<span class="badge-now">進行中</span>` : ""}
      ${rstate === "done" ? `<span class="badge-done">終了</span>` : ""}
      ${(state.mode === "staff" && hasNotes(item)) ? `<button class="expand-btn" onclick="event.stopPropagation(); toggleRow(${item.no})">写真/DVD ${isExpanded ? "▲" : "▼"}</button>` : ""}`;

    // スタッフのみ・写真/DVDのチェック欄。進行ポインタとは無関係にいつでも編集可能。
    // タップした瞬間に保存される(自由記述時代の「保存」ボタンは不要になった)。
    // 観覧モードのHTMLには一切出力しない(state.mode === "staff" のときだけ組み立てる)。
    const notePanelHtml = (isExpanded && state.mode === "staff" && hasNotes(item)) ? `
      <div class="note-panel">
        <div class="note-panel-label">写真・DVD注文(スタッフのみ・観覧側には表示されません)</div>
        <div class="note-check-row">
          ${OPTIONS_ENABLED.photo ? `
          <label class="note-check">
            <input type="checkbox" ${note.photo ? "checked" : ""} onclick="event.stopPropagation(); toggleNote(${item.no}, 'photo')" />
            <span>写真</span>
          </label>` : ""}
          ${OPTIONS_ENABLED.dvd ? `
          <label class="note-check">
            <input type="checkbox" ${note.dvd ? "checked" : ""} onclick="event.stopPropagation(); toggleNote(${item.no}, 'dvd')" />
            <span>DVD</span>
          </label>` : ""}
        </div>
      </div>` : "";

    return `
      <div class="${rowClasses}" onclick="toggleRow(${item.no})">
        <div class="row-no">${item.no}</div>
        <div class="row-time">${esc(item.time || "")}</div>
        <div class="row-body">${bodyHtml}${notePreview}</div>
        <div class="row-status">${statusHtml}</div>
      </div>
      ${notePanelHtml}`;
  }).join("");

  const setupNotice = !GAS_ENDPOINT.startsWith("https://script.google.com/macros/") ? `
    <div class="setup-notice">⚠ GAS_ENDPOINT が未設定です。コード上部の GAS_ENDPOINT に、デプロイしたGoogle Apps ScriptのウェブアプリURLを貼り付けてください。</div>` : "";

  document.getElementById("app").innerHTML = `
    <header>
      <div class="header-top">
        <div>
          <div class="eyebrow">PROGRESS BOARD</div>
          <h1>選手会パーティー</h1>
          <div class="subtitle">進行状況ボード</div>
        </div>
        <div class="mode-toggle">${modeToggleHtml}</div>
      </div>
      ${setupNotice}
      ${pinHtml}
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="progress-label">NO.${current.no} / ${ITEMS.length}　${progressPct}%</div>
    </header>

    ${renderNowCard(current)}
    ${nextHtml}
    ${controlsHtml}

    <div class="list-wrap">${rowsHtml}</div>

    <footer>
      ${state.loadError ? `<span class="err">⚠ 読み込みに失敗しました　</span>` : ""}
      ${state.saveError ? `<span class="err">⚠ 保存に失敗しました　</span>` : ""}
      ${state.updatedAt ? `最終更新 ${new Date(state.updatedAt).toLocaleTimeString("ja-JP")}` : "同期待機中"}　
      ${state.mode === "viewer" ? "· 観覧モード（自動更新）" : "· 運営モード（タップで進行を操作）"}
    </footer>

    <div class="nexus-credit">
      <svg width="18" height="18" viewBox="0 0 40 40" fill="none">
        <path d="M20 3 L34 20 L20 37 L6 20 Z" stroke="#b8863b" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="3" fill="#b8863b"/>
        <circle cx="20" cy="9" r="2" fill="#a89d86"/><circle cx="29" cy="20" r="2" fill="#a89d86"/>
        <circle cx="20" cy="31" r="2" fill="#a89d86"/><circle cx="11" cy="20" r="2" fill="#a89d86"/>
        <line x1="20" y1="20" x2="20" y2="9" stroke="#a89d86"/><line x1="20" y1="20" x2="29" y2="20" stroke="#a89d86"/>
        <line x1="20" y1="20" x2="20" y2="31" stroke="#a89d86"/><line x1="20" y1="20" x2="11" y2="20" stroke="#a89d86"/>
      </svg>
      <span>
        <span class="nexus-word">Created by NEXUS ENTERTAINMENT</span>
        <span class="nexus-tagline">進行も、演出も。窓口はひとつに。</span>
      </span>
    </div>`;

  if (state.currentIdx !== lastScrolledIdx) {
    lastScrolledIdx = state.currentIdx;
    const listWrap = document.querySelector(".list-wrap");
    const currentRow = document.querySelector(".row.current");
    if (listWrap && currentRow) {
      const wrapRect = listWrap.getBoundingClientRect();
      const rowRect = currentRow.getBoundingClientRect();
      if (rowRect.top < wrapRect.top || rowRect.bottom > wrapRect.bottom) {
        listWrap.scrollTop += (rowRect.top - wrapRect.top) - (wrapRect.height / 2);
      }
    }
  }
}
let lastScrolledIdx = -1;

/* ============ 起動 ============ */
render();
fetchState();
setInterval(fetchState, POLL_MS);
</script>
</body>
</html>
